<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TESLA TECH — Gestión de Taller y POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F7FA;
      color: #1E293B;
      margin: 0;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="flex h-screen overflow-hidden select-none">

  <!-- =========================================================
       SIDEBAR IZQUIERDO (MENÚ PRINCIPAL)
  ========================================================== -->
  <aside id="main-sidebar" class="w-60 bg-white border-r border-slate-200/80 flex flex-col h-full shrink-0 z-20">
    <div class="h-16 px-4 flex items-center gap-3 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-[#D4F097] flex items-center justify-center text-[#2B4C12] font-bold text-base shadow-2xs">
        T
      </div>
      <span id="brand-name-sidebar" class="font-bold text-[15px] tracking-tight text-slate-900 uppercase">TESLA TECH</span>
    </div>

    <nav id="main-nav" class="flex-1 overflow-y-auto px-3 py-2 space-y-5 text-[13px]">
      <div class="space-y-0.5">
        <button onclick="navigate('inicio')" data-nav="inicio" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="home" class="w-4 h-4 text-slate-400"></i> Inicio</span>
        </button>
        <button onclick="navigate('recibir')" data-nav="recibir" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="plus" class="w-4 h-4 text-slate-400"></i> Recibir</span>
        </button>
        <button onclick="navigate('clientes')" data-nav="clientes" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="users" class="w-4 h-4 text-slate-400"></i> Clientes</span>
        </button>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Operación</div>
        <div class="space-y-0.5" id="nav-operacion"></div>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Punto de Venta</div>
        <div class="space-y-0.5" id="nav-pos"></div>
      </div>

      <div class="pb-4">
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Administración</div>
        <div class="space-y-0.5">
          <button onclick="navigate('equipo')" data-nav="equipo" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
            <span class="flex items-center gap-3"><i data-lucide="user-plus" class="w-4 h-4 text-slate-400"></i> Mi Equipo</span>
          </button>
          <button onclick="navigate('ajustes')" data-nav="ajustes" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg bg-[#E9F5D8] text-[#2F5211] font-medium transition-colors">
            <span class="flex items-center gap-3"><i data-lucide="settings" class="w-4 h-4 text-[#4D7C1F]"></i> Ajustes</span>
          </button>
        </div>
      </div>
    </nav>
  </aside>

  <!-- =========================================================
       CONTENEDOR PRINCIPAL DERECHO
  ========================================================== -->
  <div class="flex-1 flex flex-col h-full min-w-0">
    <header id="standard-header" class="h-16 px-8 flex items-center justify-between shrink-0 bg-[#F4F7FA]">
      <h1 id="page-title" class="text-[20px] font-bold text-slate-900 tracking-tight">Inicio</h1>
      <button onclick="refreshView()" class="inline-flex items-center gap-2 px-3.5 py-1.5 bg-white border border-slate-200/90 rounded-lg text-[13px] font-medium text-slate-700 hover:bg-slate-50 active:scale-[0.99] transition-all shadow-2xs">
        <i id="refresh-icon" data-lucide="rotate-cw" class="w-3.5 h-3.5 text-slate-500"></i>
        Actualizar
      </button>
    </header>

    <main id="workspace" class="flex-1 overflow-y-auto px-8 pb-10"></main>
  </div>

  <!-- =========================================================
       VISTA FULLSCREEN DE DETALLE DE ORDEN
  ========================================================== -->
  <div id="order-detail-overlay" class="fixed inset-0 bg-[#F4F7FA] z-40 hidden flex-col overflow-hidden">
    <div id="order-detail-header" class="bg-white border-b border-slate-200/80 px-5 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0"></div>
    <div id="order-detail-body" class="flex-1 overflow-y-auto p-5 space-y-4"></div>
  </div>

  <!-- =========================================================
       MODAL GESTIONAR CUENTA / SUSCRIPCIÓN
