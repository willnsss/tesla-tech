    function submitReceiveOrder() {
      const nombre = (document.getElementById('rec-nombre')?.value || '').trim();
      const apellido = (document.getElementById('rec-apellido')?.value || '').trim();
      const telRaw = (document.getElementById('rec-telefono')?.value || '').trim();
      const marca = (document.getElementById('rec-marca')?.value || '').trim();
      const modelo = (document.getElementById('rec-modelo')?.value || '').trim();
      const falla = (document.getElementById('rec-falla')?.value || '').trim();

      if (!nombre || !apellido || !telRaw || !marca || !modelo || !falla) {
        updateMissingBadges();
        showToast('Completa los campos obligatorios marcados con *');
        return;
      }

      const fullName = `${nombre} ${apellido}`.toUpperCase();
      const phone = telRaw.startsWith('+') ? telRaw : '+57' + telRaw;
      const docNumber = (document.getElementById('rec-doc')?.value || '').trim();
      const address = (document.getElementById('rec-direccion')?.value || '').trim() || 'N/A';
      const color = (document.getElementById('rec-color')?.value || '').trim() || 'N/A';
      const servicesSum = receiveFormState.services.reduce((a, s) => a + s.price, 0);
      const total = Number(document.getElementById('rec-total-input')?.value || servicesSum || 0);
      const abono = Number(document.getElementById('rec-abono-input')?.value || 0);

      let clientObj = state.clients.find(c => c.fullName.toLowerCase() === fullName.toLowerCase());
      if (!clientObj) {
        clientObj = {
          id: 'cli-' + Date.now(), type: receiveFormState.clientMode, firstName: nombre, lastName: apellido,
          fullName, initials: getInitials(fullName), avatarBg: 'bg-emerald-500/20 text-emerald-400',
          phone, docType: receiveFormState.docType, docNumber,
          email: (document.getElementById('rec-correo')?.value || '').trim(),
          address: address === 'N/A' ? '' : address, conflictive: false, isPosClient: false
        };
        state.clients.unshift(clientObj);
      }

      const nextNum = state.orders.reduce((m, o) => Math.max(m, o.number), 0) + 1;
      state.orders.unshift({
        number: nextNum,
        clientId: clientObj.id,
        device: `${marca} ${modelo}`,
        color,
        issue: falla,
        technician: 'Sin asig.',
        daysElapsed: '0d',
        internalNotes: (document.getElementById('rec-obs')?.value || '').trim() || 'N/A',
        accessories: [...receiveFormState.accessoriesChecked, ...receiveFormState.customAccessories].join(', ') || 'Ninguno',
        technicalReport: '',
        statusIndex: 0,
        isToday: true,
        receivedDate: '25 nov 2026',
        lastOrderText: 'hace un momento',
        warrantyDays: receiveFormState.warrantyDays,
        serviceModality: receiveFormState.modality,
        client: { name: fullName, docId: docNumber || 'N/A', phone, address },
        priceTotal: total,
        paidAmount: abono,
        extraQuotes: [],
        expenses: [...receiveFormState.orderExpenses],
        photos: receiveFormState.photosCount,
        signatureText: '',
        history: [{ status: 'Recibido', timeAgo: 'hace un momento', dateShort: '25 nov' }]
      });

      receiveFormState.services = [];
      receiveFormState.orderExpenses = [];
      receiveFormState.photosCount = 0;
      receiveFormState.customAccessories = [];
      receiveFormState.accessoriesChecked = [];
      receiveFormState.checklistItems = [];

      saveState();
      state.activeRoute = 'inicio';
      renderSidebar();
      renderWorkspace();
      showToast(`Orden #${nextNum} guardada`);
    }

              </div>

              <div class="app-surface rounded-2xl border p-4 shadow-2xs space-y-3">
                <div class="flex items-center gap-2 text-xs font-bold text-main">
                  <i data-lucide="trending-up" class="w-4 h-4 text-[#84CC16]"></i>
                  <span>Gastos Asociados</span>
                </div>

                <div class="text-center text-[11px] text-dim py-1">
                  ${(o.expenses || []).length === 0 ? 'Sin gastos registrados' : (o.expenses || []).map(e => `${e.label}: ${formatCOP(e.amount)}`).join(' · ')}
                </div>

                <div class="flex items-center justify-between text-xs pt-1 border-t app-border">
                  <span class="text-sec font-medium">Total Gastos</span>
                  <span class="font-bold text-rose-500">-${formatCOP(expensesSum)}</span>
                </div>

                <div class="p-3 rounded-xl accent-soft border flex items-center justify-between">
                  <span class="text-xs font-bold text-[#84CC16]">Ganancia Neta</span>
                  <span class="text-sm font-extrabold text-[#84CC16]">${formatCOP(gananciaNeta)}</span>
                </div>
              </div>
            </div>
          </div>

          <div class="pt-2 pb-4 flex justify-center">
            <button type="button" onclick="deleteOrderFromDetail(${idx})" class="inline-flex items-center gap-1.5 text-xs font-bold text-rose-500 hover:text-rose-400 py-2 px-4 rounded-lg hover:bg-rose-500/10 transition-colors">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i> Eliminar Orden
            </button>
          </div>
        </div>
      `;

      lucide.createIcons();
    }

    function setOrderStatus(orderIdx, stepIdx) {
      const o = state.orders[orderIdx];
      if (!o) return;
      o.statusIndex = stepIdx;
      o.history.unshift({ status: STEPS[stepIdx], timeAgo: 'hace un momento', dateShort: '25 nov' });
      saveState();
      openOrderDetail(orderIdx);
      showToast(`Estado actualizado a: ${STEPS[stepIdx]}`);
    }

    function advanceOrderStatus(orderIdx) {
      const o = state.orders[orderIdx];
      if (!o) return;
      const next = Math.min(STEPS.length - 1, o.statusIndex + 1);
      setOrderStatus(orderIdx, next);
    }

    function openTechnicalReportModal(orderIdx) {
      const o = state.orders[orderIdx];
      openQuickModal(`
        <h3 class="font-bold text-sm text-main mb-2">Reporte Técnico — Orden #${o.number}</h3>
        <form onsubmit="saveTechnicalReport(event, ${orderIdx})" class="space-y-3 text-xs">
          <textarea id="tr-text" rows="4" class="w-full p-3 border rounded-xl" placeholder="Diagnóstico y reparación realizada...">${o.technicalReport || ''}</textarea>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeQuickModal()" class="px-3 py-1.5 border rounded-lg text-sec">Cancelar</button>
            <button type="submit" class="px-4 py-1.5 bg-[#84CC16] text-slate-950 font-semibold rounded-lg">Guardar Reporte</button>
          </div>
        </form>
      `);
    }

    function saveTechnicalReport(e, orderIdx) {
      e.preventDefault();
      state.orders[orderIdx].technicalReport = document.getElementById('tr-text').value;
      saveState();
      closeQuickModal();
      openOrderDetail(orderIdx);
      showToast('Reporte técnico guardado');
    }

    function openExtraQuoteModal(orderIdx) {
      openQuickModal(`
        <h3 class="font-bold text-sm text-main mb-2">Presupuesto Adicional</h3>
        <form onsubmit="saveExtraQuote(event, ${orderIdx})" class="space-y-3 text-xs">
          <input id="eq-label" type="text" placeholder="Concepto (ej. Cambio de flex o batería)" class="w-full px-3 py-2 border rounded-lg" required />
          <input id="eq-amt" type="number" placeholder="Monto en COP" class="w-full px-3 py-2 border rounded-lg" required />
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeQuickModal()" class="px-3 py-1.5 border rounded-lg text-sec">Cancelar</button>
            <button type="submit" class="px-4 py-1.5 bg-[#84CC16] text-slate-950 font-semibold rounded-lg">Agregar</button>
          </div>
        </form>
      `);
    }

    function saveExtraQuote(e, orderIdx) {
      e.preventDefault();
      const o = state.orders[orderIdx];
      o.extraQuotes = o.extraQuotes || [];
      o.extraQuotes.push({
        label: document.getElementById('eq-label').value,
        amount: Number(document.getElementById('eq-amt').value)
      });
      saveState();
      closeQuickModal();
      openOrderDetail(orderIdx);
      showToast('Presupuesto adicional agregado');
    }

    function openEditOrderModal(orderIdx) {
      const o = state.orders[orderIdx];
      openQuickModal(`
        <h3 class="font-bold text-sm text-main mb-2">Editar Orden #${o.number}</h3>
        <form onsubmit="saveEditedOrder(event, ${orderIdx})" class="space-y-3 text-xs">
          <div>
            <label class="block font-semibold text-sec mb-1">Equipo</label>
            <input id="eo-device" type="text" value="${o.device}" class="w-full px-3 py-2 border rounded-lg" required />
          </div>
          <div>
            <label class="block font-semibold text-sec mb-1">Falla Reportada</label>
            <input id="eo-issue" type="text" value="${o.issue}" class="w-full px-3 py-2 border rounded-lg" required />
          </div>
          <div>
            <label class="block font-semibold text-sec mb-1">Precio Total (COP)</label>
            <input id="eo-price" type="number" value="${o.priceTotal}" class="w-full px-3 py-2 border rounded-lg" required />
          </div>
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeQuickModal()" class="px-3 py-1.5 border rounded-lg text-sec">Cancelar</button>
            <button type="submit" class="px-4 py-1.5 bg-[#84CC16] text-slate-950 font-semibold rounded-lg">Guardar Cambios</button>
          </div>
        </form>
      `);
    }

    function saveEditedOrder(e, orderIdx) {
      e.preventDefault();
      const o = state.orders[orderIdx];
      o.device = document.getElementById('eo-device').value;
      o.issue = document.getElementById('eo-issue').value;
      o.priceTotal = Number(document.getElementById('eo-price').value);
      saveState();
      closeQuickModal();
      openOrderDetail(orderIdx);
      showToast('Orden actualizada');
    }

    function addOrderPhoto(orderIdx) {
      const o = state.orders[orderIdx];
      if ((o.photos || 0) >= 8) {
        showToast('Máximo 8 fotos por orden');
        return;
      }
      o.photos = (o.photos || 0) + 1;
      saveState();
      openOrderDetail(orderIdx);
      showToast(`Evidencia fotográfica agregada (${o.photos}/8)`);
    }

    function captureClientSignature(orderIdx) {
      const o = state.orders[orderIdx];
      o.signatureText = o.client.name;
      saveState();
      openOrderDetail(orderIdx);
      showToast(`Firma capturada para ${o.client.name}`);
    }

    function deleteOrderFromDetail(idx) {
      state.orders.splice(idx, 1);
      saveState();
      closeOrderDetail();
      renderWorkspace();
      showToast('Orden eliminada');
    }

    function closeOrderDetail() {
      state.selectedOrderIndex = null;
      const overlay = document.getElementById('order-detail-overlay');
      overlay.classList.add('hidden');
      overlay.classList.remove('flex');
      renderWorkspace();
    }

    function openQuickModal(html) {
      const modal = document.getElementById('quick-action-modal');
      document.getElementById('quick-action-content').innerHTML = html;
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function closeQuickModal() {
      const modal = document.getElementById('quick-action-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      document.getElementById('toast-msg').textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      clearTimeout(window._toastTimer);
      window._toastTimer = setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 3000);
    }

    applyTheme();
    renderSidebar();
    renderWorkspace();
  </script>
</body>
</html>
