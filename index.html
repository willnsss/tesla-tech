<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TESLA TECH — Gestión de Taller y POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: #F4F7FA;
      color: #1E293B;
      margin: 0;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #CBD5E1; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #94A3B8; }
  </style>
</head>
<body class="flex h-screen overflow-hidden select-none">

  <!-- =========================================================
       SIDEBAR IZQUIERDO (MENÚ PRINCIPAL)
  ========================================================== -->
  <aside id="main-sidebar" class="w-60 bg-white border-r border-slate-200/80 flex flex-col h-full shrink-0 z-20">
    <div class="h-16 px-4 flex items-center gap-3 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-[#D4F097] flex items-center justify-center text-[#2B4C12] font-bold text-base shadow-2xs">
        T
      </div>
      <span id="brand-name-sidebar" class="font-bold text-[15px] tracking-tight text-slate-900 uppercase">TESLA TECH</span>
    </div>

    <nav id="main-nav" class="flex-1 overflow-y-auto px-3 py-2 space-y-5 text-[13px]">
      <div class="space-y-0.5">
        <button onclick="navigate('inicio')" data-nav="inicio" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="home" class="w-4 h-4 text-slate-400"></i> Inicio</span>
        </button>
        <button onclick="navigate('recibir')" data-nav="recibir" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="plus" class="w-4 h-4 text-slate-400"></i> Recibir</span>
        </button>
        <button onclick="navigate('clientes')" data-nav="clientes" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="users" class="w-4 h-4 text-slate-400"></i> Clientes</span>
        </button>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Operación</div>
        <div class="space-y-0.5" id="nav-operacion"></div>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Punto de Venta</div>
        <div class="space-y-0.5" id="nav-pos"></div>
      </div>

      <div class="pb-4">
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-slate-400 uppercase">Administración</div>
        <div class="space-y-0.5">
          <button onclick="navigate('equipo')" data-nav="equipo" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
            <span class="flex items-center gap-3"><i data-lucide="user-plus" class="w-4 h-4 text-slate-400"></i> Mi Equipo</span>
          </button>
          <button onclick="navigate('ajustes')" data-nav="ajustes" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors">
            <span class="flex items-center gap-3"><i data-lucide="settings" class="w-4 h-4 text-slate-400"></i> Ajustes</span>
          </button>
        </div>
      </div>
    </nav>
  </aside>

  <!-- =========================================================
       CONTENEDOR PRINCIPAL DERECHO
  ========================================================== -->
  <div class="flex-1 flex flex-col h-full min-w-0">
    <main id="workspace" class="flex-1 overflow-y-auto px-7 py-5"></main>
  </div>

  <!-- =========================================================
       VISTA FULLSCREEN DE DETALLE DE ORDEN
  ========================================================== -->
  <div id="order-detail-overlay" class="fixed inset-0 bg-[#F4F7FA] z-40 hidden flex-col overflow-hidden">
    <div id="order-detail-header" class="bg-white border-b border-slate-200/80 px-5 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0"></div>
    <div id="order-detail-body" class="flex-1 overflow-y-auto px-6 py-4 space-y-4"></div>
  </div>

  <!-- =========================================================
       MODAL RÁPIDO GENÉRICO
  ========================================================== -->
  <div id="quick-action-modal" class="fixed inset-0 bg-slate-900/40 backdrop-blur-[2px] hidden items-center justify-center z-50 p-4">
    <div id="quick-action-content" class="bg-white rounded-2xl max-w-md w-full p-6 shadow-xl border border-slate-100 max-h-[92vh] overflow-y-auto"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-[#84CC16]"></i>
    <span id="toast-msg">Acción completada</span>
  </div>

  <!-- =========================================================
       JAVASCRIPT DE LA APLICACIÓN
  ========================================================== -->
  <script>
    const STEPS = ['Recibido', 'Diagnóstico', 'En Reparación', 'Listo para Entregar', 'Entregado'];
    const STORAGE_KEY = 'teslatech_app_state_unified_v2';

    const defaultState = {
      activeRoute: 'inicio',
      homeSearch: '',
      homeFilterTab: 'activas',
      hideAmounts: false,
      darkMode: false,
      selectedOrderIndex: null,
      selectedClientId: null,
      clientSearch: '',
      newClientType: 'Persona',
      newClientDocType: 'CC',
      clients: [
        {
          id: 'cli-1',
          type: 'Persona',
          firstName: 'DAYANA',
          lastName: 'FLOREZ',
          fullName: 'DAYANA FLOREZ',
          initials: 'DF',
          avatarBg: 'bg-amber-100/80 text-amber-700',
          phone: '+573226207154',
          docType: 'CC',
          docNumber: '',
          email: '',
          address: '',
          conflictive: false,
          isPosClient: false
        },
        {
          id: 'cli-2',
          type: 'Persona',
          firstName: 'Maria',
          lastName: 'Rodriguez',
          fullName: 'Maria Rodriguez',
          initials: 'MR',
          avatarBg: 'bg-emerald-100/80 text-emerald-700',
          phone: '+573187152134',
          docType: 'CC',
          docNumber: '12345678',
          email: '',
          address: '',
          conflictive: false,
          isPosClient: false
        },
        {
          id: 'cli-3',
          type: 'Persona',
          firstName: 'Maria',
          lastName: 'Velez',
          fullName: 'Maria Velez',
          initials: 'MV',
          avatarBg: 'bg-emerald-100/80 text-emerald-700',
          phone: '+573505659860',
          docType: 'CC',
          docNumber: '1034297687',
          email: '',
          address: '',
          conflictive: false,
          isPosClient: false
        }
      ],
      orders: [
        {
          number: 3,
          clientId: 'cli-1',
          device: 'appple iphone 13 pro max',
          color: 'plateado',
          issue: 'cambio bateria',
          technician: 'Sin asig.',
          daysElapsed: '0d',
          internalNotes: 'N/A',
          accessories: 'Ninguno',
          technicalReport: '',
          statusIndex: 0,
          isToday: false,
          receivedDate: '24 nov 2026',
          lastOrderText: 'hace 23h',
          warrantyDays: 30,
          serviceModality: 'En el taller',
          client: {
            name: 'DAYANA FLOREZ',
            docId: 'N/A',
            phone: '+573226207154',
            address: 'N/A'
          },
          priceTotal: 260000,
          paidAmount: 0,
          extraQuotes: [],
          expenses: [],
          photos: 0,
          signatureText: '',
          history: [
            { status: 'Recibido', timeAgo: 'hace 23 h 7 min', dateShort: '24 nov' }
          ]
        }
      ]
    };

    const receiveFormState = {
      clientMode: 'Persona',
      docType: 'CC',
      modality: 'En el taller',
      showPass: false,
      passPatternMode: false,
      accessoriesChecked: [],
      customAccessories: [],
      checklistItems: [],
      services: [],
      orderExpenses: [],
      warrantyDays: 30,
      photosCount: 0
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return { ...defaultState, ...JSON.parse(saved) };
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    const state = loadState();

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    const operationItems = [
      { id: 'inventario', label: 'Inventario', icon: 'package', locked: true },
      { id: 'reposicion', label: 'Reposición', icon: 'clipboard-check', locked: true },
      { id: 'presupuestos', label: 'Presupuestos', icon: 'file-text', locked: false },
      { id: 'garantias', label: 'Garantías y Abandonos', icon: 'alert-triangle', locked: true },
      { id: 'estadisticas', label: 'Estadísticas', icon: 'pie-chart', locked: true },
      { id: 'historial', label: 'Historial', icon: 'history', locked: true },
      { id: 'visitas', label: 'Visitas a domicilio', icon: 'calendar', locked: true },
      { id: 'ingresos', label: 'Ingresos y Gastos', icon: 'dollar-sign', locked: true },
      { id: 'corte', label: 'Corte de Caja', icon: 'archive', locked: true },
      { id: 'auditoria', label: 'Auditoria POS', icon: 'shield-check', locked: true },
      { id: 'reportes', label: 'Reportes', icon: 'file-spreadsheet', locked: true },
      { id: 'comisiones', label: 'Comisiones', icon: 'coins', locked: true }
    ];

    const posItems = [
      { id: 'pos', label: 'Punto de Venta', icon: 'shopping-cart', locked: true },
      { id: 'cobrar', label: 'Cuentas por Cobrar', icon: 'arrow-down-left', locked: true },
      { id: 'pagar', label: 'Cuentas por Pagar', icon: 'file-minus', locked: true },
      { id: 'recibos', label: 'Recibos POS', icon: 'receipt', locked: true }
    ];

    function formatCOP(val) {
      if (state.hideAmounts) return 'COP ••••••';
      return 'COP ' + Number(val || 0).toLocaleString('es-CO');
    }

    function getInitials(name) {
      const parts = (name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return 'CL';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function getClientOrders(client) {
      return state.orders.filter(o =>
        (client.id && o.clientId === client.id) ||
        (o.client && o.client.name && o.client.name.toLowerCase() === client.fullName.toLowerCase())
      );
    }

    // =========================================================
    // SIDEBAR Y NAVEGACIÓN
    // =========================================================
    function renderSidebar() {
      const renderGroup = (items, containerId) => {
        const container = document.getElementById(containerId);
        container.innerHTML = items.map(item => {
          const isActive = state.activeRoute === item.id;
          return `
            <button onclick="navigate('${item.id}')"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg transition-colors ${
                isActive
                  ? 'bg-[#E9F5D8] text-[#2F5211] font-medium'
                  : item.locked
                    ? 'text-slate-400 hover:bg-slate-50/70'
                    : 'text-slate-600 hover:bg-slate-50'
              }">
              <span class="flex items-center gap-3 truncate">
                <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${isActive ? 'text-[#4D7C1F]' : 'text-slate-400'}"></i>
                <span class="truncate">${item.label}</span>
              </span>
              ${item.locked ? `<i data-lucide="lock" class="w-3 h-3 text-slate-300 shrink-0"></i>` : ''}
            </button>
          `;
        }).join('');
      };

      renderGroup(operationItems, 'nav-operacion');
      renderGroup(posItems, 'nav-pos');

      document.querySelectorAll('.nav-item').forEach(btn => {
        const route = btn.getAttribute('data-nav');
        const icon = btn.querySelector('i');
        if (route === state.activeRoute) {
          btn.className = 'nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg bg-[#E9F5D8] text-[#2F5211] font-medium transition-colors';
          if (icon) icon.classList.replace('text-slate-400', 'text-[#4D7C1F]');
        } else {
          btn.className = 'nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-slate-600 hover:bg-slate-50 transition-colors';
          if (icon) icon.classList.replace('text-[#4D7C1F]', 'text-slate-400');
        }
      });

      lucide.createIcons();
    }

    function navigate(routeId) {
      state.activeRoute = routeId;
      if (routeId !== 'clientes') {
        state.selectedClientId = null;
      }
      saveState();
      renderSidebar();
      renderWorkspace();
    }

    function renderWorkspace() {
      const ws = document.getElementById('workspace');

      if (state.activeRoute === 'inicio') {
        ws.innerHTML = renderInicioScreen();
      } else if (state.activeRoute === 'recibir') {
        ws.innerHTML = renderRecibirScreen();
      } else if (state.activeRoute === 'clientes') {
        ws.innerHTML = state.selectedClientId ? renderClientDetailView() : renderClientesListView();
      } else {
        const allItems = [...operationItems, ...posItems];
        const found = allItems.find(i => i.id === state.activeRoute);
        ws.innerHTML = `
          <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-bold text-slate-900">${found ? found.label : state.activeRoute}</h1>
            <button onclick="navigate('inicio')" class="px-3.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50">
              Volver a Inicio
            </button>
          </div>
          <div class="bg-white rounded-2xl border border-slate-200/70 p-6 text-xs text-slate-500">
            Sección <strong>${found ? found.label : state.activeRoute}</strong> lista para continuar.
          </div>
        `;
      }

      lucide.createIcons();
      if (state.activeRoute === 'recibir') {
        updateMissingBadges();
      }
    }

    // =========================================================
    // VISTA INICIO
    // =========================================================
    function renderInicioScreen() {
      const q = (state.homeSearch || '').trim().toLowerCase();

      const activeOrders = state.orders.filter(o => o.statusIndex < 4);
      const receivedOrders = state.orders.filter(o => o.statusIndex === 0);
      const todayOrders = state.orders.filter(o => o.isToday);

      const pendingTotal = activeOrders.reduce((acc, o) => {
        const extra = (o.extraQuotes || []).reduce((s, item) => s + item.amount, 0);
        const total = (o.priceTotal || 0) + extra;
        return acc + Math.max(0, total - (o.paidAmount || 0));
      }, 0);

      const pendingOrdersCount = activeOrders.filter(o => {
        const extra = (o.extraQuotes || []).reduce((s, item) => s + item.amount, 0);
        const total = (o.priceTotal || 0) + extra;
        return (total - (o.paidAmount || 0)) > 0;
      }).length;

      let baseList = activeOrders;
      if (state.homeFilterTab === 'recibido') baseList = receivedOrders;
      if (state.homeFilterTab === 'hoy') baseList = todayOrders;

      const filteredOrders = baseList.filter(o =>
        String(o.number).includes(q) ||
        (o.device || '').toLowerCase().includes(q) ||
        (o.client?.name || '').toLowerCase().includes(q) ||
        (o.client?.phone || '').toLowerCase().includes(q)
      );

      const lastOrderText = state.orders[0]?.lastOrderText || 'hace 23h';

      const rowsHtml = filteredOrders.length === 0
        ? `<div class="py-10 text-center text-xs text-slate-400">No hay órdenes en esta vista.</div>`
        : filteredOrders.map(o => {
            const globalIdx = state.orders.indexOf(o);
            const extra = (o.extraQuotes || []).reduce((s, item) => s + item.amount, 0);
            const total = (o.priceTotal || 0) + extra;
            const pend = Math.max(0, total - (o.paidAmount || 0));
            const statusName = STEPS[o.statusIndex] || 'Recibido';

            return `
              <div onclick="openOrderDetail(${globalIdx})" class="px-5 py-3.5 hover:bg-slate-50/90 transition-colors cursor-pointer grid grid-cols-12 items-center gap-3 text-xs border-t border-slate-100 first:border-t-0">
                <div class="col-span-5 flex items-center gap-3 min-w-0">
                  <div class="w-8 h-8 rounded-full bg-slate-100 text-slate-400 flex items-center justify-center shrink-0">
                    <i data-lucide="user" class="w-4 h-4"></i>
                  </div>
                  <div class="truncate">
                    <div class="font-bold text-slate-900 truncate">${o.client.name}</div>
                    <div class="text-[11px] text-slate-400 truncate">${o.device}</div>
                  </div>
                </div>
                <div class="col-span-2">
                  <span class="inline-block px-2.5 py-0.5 rounded-md bg-sky-50 text-sky-600 font-semibold text-[11px]">${statusName}</span>
                </div>
                <div class="col-span-1 font-bold text-slate-800">#${o.number}</div>
                <div class="col-span-1 text-slate-400 text-[11px] truncate">${o.technician || 'Sin asig.'}</div>
                <div class="col-span-1 font-bold text-slate-800 text-[11px]">${o.daysElapsed || '0d'}</div>
                <div class="col-span-2 flex items-center justify-end gap-3 text-right">
                  <div>
                    <div class="font-extrabold text-slate-900 text-xs">${formatCOP(pend > 0 ? pend : total)}</div>
                    <div class="text-[10px] ${pend > 0 ? 'text-rose-500 font-medium' : 'text-emerald-600 font-medium'}">${pend > 0 ? 'Pendiente' : 'Pagado'}</div>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); openOrderDetail(${globalIdx})" class="text-slate-400 hover:text-slate-700 p-1 rounded-lg hover:bg-slate-100">
                    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            `;
          }).join('');

      return `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 class="text-[20px] font-bold text-slate-900 leading-tight">Inicio</h1>
              <p class="text-[11px] text-slate-400 mt-0.5">Última orden: ${lastOrderText}</p>
            </div>

            <div class="flex items-center gap-2.5 flex-wrap">
              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input
                  type="text"
                  value="${state.homeSearch}"
                  oninput="updateHomeSearch(this.value)"
                  placeholder="Buscar órdenes o clientes..."
                  class="pl-8 pr-8 py-1.5 w-64 bg-white border border-slate-200/90 rounded-lg text-xs text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-[#84CC16]"
                />
                <button type="button" onclick="showToast('Escáner de códigos / IMEI listo')" class="text-slate-400 hover:text-slate-600 absolute right-2.5 top-1/2 -translate-y-1/2" title="Escanear código">
                  <i data-lucide="scan-line" class="w-3.5 h-3.5"></i>
                </button>
              </div>

              <button type="button" onclick="refreshInicio()" class="inline-flex items-center gap-1.5 px-3 py-1.5 bg-white border border-slate-200/90 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50 transition-colors">
                <i id="inicio-refresh-icon" data-lucide="rotate-cw" class="w-3.5 h-3.5 text-slate-500"></i>
                Actualizar
              </button>

              <button type="button" onclick="toggleThemeHint()" class="w-8 h-8 rounded-lg bg-white border border-slate-200/90 hover:bg-slate-50 flex items-center justify-center text-slate-600 transition-colors" title="Alternar tema">
                <i data-lucide="moon" class="w-3.5 h-3.5"></i>
              </button>

              <button type="button" onclick="navigate('recibir')" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#84CC16] hover:bg-[#73B312] text-slate-950 font-bold text-xs shadow-2xs transition-colors">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Recibir
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-5 rounded-2xl bg-[#84CC16] text-slate-950 p-5 flex flex-col justify-between min-h-[126px] shadow-2xs">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-[#1E3A08]">Pendiente</span>
                <button type="button" onclick="toggleHideAmounts()" class="text-[#2F5211] hover:text-slate-950 p-1 rounded-lg transition-colors" title="Ocultar/mostrar montos">
                  <i data-lucide="${state.hideAmounts ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="mt-3">
                <div class="text-[22px] font-extrabold tracking-tight text-slate-950">${formatCOP(pendingTotal)}</div>
                <div class="text-xs font-medium text-[#2F5211] mt-1">Por cobrar en ${pendingOrdersCount} ${pendingOrdersCount === 1 ? 'orden' : 'órdenes'}</div>
              </div>
            </div>

            <div class="md:col-span-3 rounded-2xl bg-white border border-slate-200/80 p-5 flex flex-col justify-between min-h-[126px] shadow-2xs">
              <div class="flex items-center gap-2 text-xs font-semibold text-slate-600">
                <i data-lucide="plus-circle" class="w-4 h-4 text-[#65A30D]"></i>
                <span>Nuevas Hoy</span>
              </div>
              <div class="mt-3">
                <div class="text-[22px] font-extrabold text-slate-900 leading-none">${todayOrders.length}</div>
                <div class="text-xs text-slate-400 mt-2">${todayOrders.length === 0 ? 'Ninguna todavía' : 'Recibidas hoy'}</div>
              </div>
            </div>

            <div class="md:col-span-4 rounded-2xl bg-white border border-slate-200/80 p-5 flex flex-col justify-between min-h-[126px] shadow-2xs">
              <div class="flex items-center gap-2 text-xs font-semibold text-slate-600">
                <i data-lucide="clock" class="w-4 h-4 text-[#65A30D]"></i>
                <span>Órdenes Activas</span>
              </div>
              <div class="mt-3 flex items-end justify-between gap-2">
                <div>
                  <div class="text-[22px] font-extrabold text-slate-900 leading-none">${activeOrders.length}</div>
                  <div class="text-xs text-slate-400 mt-2">Ninguna lista para entregar</div>
                </div>
                <button type="button" onclick="setHomeTab('hoy')" class="px-2.5 py-1 rounded-lg bg-slate-100 hover:bg-[#E9F5D8] hover:text-[#2F5211] text-[11px] font-semibold text-slate-600 transition-colors">
                  Para hoy
                </button>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button type="button" onclick="setHomeTab('activas')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-colors ${
              state.homeFilterTab === 'activas'
                ? 'bg-[#E9F5D8] text-[#2F5211]'
                : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'
            }">
              Activas ${activeOrders.length}
            </button>
            <button type="button" onclick="setHomeTab('recibido')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-colors ${
              state.homeFilterTab === 'recibido'
                ? 'bg-[#E9F5D8] text-[#2F5211]'
                : 'bg-white border border-slate-200 text-slate-500 hover:bg-slate-50'
            }">
              Recibido ${receivedOrders.length}
            </button>
          </div>

          <div class="bg-white rounded-2xl border border-slate-200/80 overflow-hidden shadow-2xs">
            <div class="px-5 py-3 border-b border-slate-100 grid grid-cols-12 gap-3 text-[11px] font-semibold text-slate-400">
              <div class="col-span-5">Cliente</div>
              <div class="col-span-2">Estado</div>
              <div class="col-span-1">Orden</div>
              <div class="col-span-1">Técnico</div>
              <div class="col-span-1">Tiempo</div>
              <div class="col-span-2 text-right">Balance</div>
            </div>
            <div>
              ${rowsHtml}
            </div>
          </div>
        </div>
      `;
    }

    function updateHomeSearch(val) {
      state.homeSearch = val;
      saveState();
      renderWorkspace();
      const input = document.querySelector('input[placeholder*="Buscar órdenes"]');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function setHomeTab(tab) {
      state.homeFilterTab = tab;
      saveState();
      renderWorkspace();
    }

    function toggleHideAmounts() {
      state.hideAmounts = !state.hideAmounts;
      saveState();
      renderWorkspace();
    }

    function toggleThemeHint() {
      state.darkMode = !state.darkMode;
      saveState();
      showToast(state.darkMode ? 'Modo oscuro seleccionado' : 'Modo claro activo');
    }

    function refreshInicio() {
      const icon = document.getElementById('inicio-refresh-icon');
      if (icon) icon.classList.add('animate-spin');
      setTimeout(() => {
        if (icon) icon.classList.remove('animate-spin');
        renderWorkspace();
        showToast('Tablero actualizado');
      }, 350);
    }

    // =========================================================
    // VISTA CLIENTES + MODAL NUEVO CLIENTE + DETALLE CLIENTE
    // =========================================================
    function renderClientesListView() {
      const q = (state.clientSearch || '').trim().toLowerCase();
      const filtered = state.clients.filter(c =>
        c.fullName.toLowerCase().includes(q) ||
        (c.docNumber || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q)
      );

      const frequentCount = state.clients.filter(c => getClientOrders(c).length >= 2).length;
      const posCount = state.clients.filter(c => c.isPosClient).length;

      const rowsHtml = filtered.length === 0
        ? `<div class="bg-white rounded-2xl border border-slate-200/70 p-10 text-center text-xs text-slate-400">No se encontraron clientes con "${state.clientSearch}".</div>`
        : filtered.map(c => `
            <div onclick="openClientDetail('${c.id}')" class="bg-white hover:bg-slate-50/80 border border-slate-200/70 rounded-xl px-5 py-3.5 flex items-center justify-between gap-4 cursor-pointer transition-colors shadow-2xs">
              <div class="flex items-center gap-3.5 w-1/3 min-w-[180px]">
                <div class="w-9 h-9 rounded-full ${c.avatarBg || 'bg-emerald-100/80 text-emerald-700'} font-bold text-xs flex items-center justify-center shrink-0">
                  ${c.initials || getInitials(c.fullName)}
                </div>
                <div>
                  <div class="text-[13px] font-bold text-slate-900 leading-tight">${c.fullName}</div>
                  ${c.conflictive ? `<span class="inline-block mt-0.5 text-[10px] font-semibold text-rose-600 bg-rose-50 px-1.5 py-0.5 rounded">Cliente conflictivo</span>` : ''}
                </div>
              </div>
              <div class="w-1/4 text-xs text-slate-500 font-medium">
                ${c.docNumber ? `<span class="text-slate-400 mr-1">#</span>${c.docNumber}` : ''}
              </div>
              <div class="flex-1 flex items-center justify-end gap-6 text-xs text-slate-600 font-medium">
                <span class="inline-flex items-center gap-1.5">
                  <i data-lucide="phone" class="w-3.5 h-3.5 text-slate-400"></i>
                  ${c.phone || '—'}
                </span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-slate-400 shrink-0"></i>
              </div>
            </div>
          `).join('');

      return `
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-[20px] font-bold text-slate-900">Clientes</h1>
          <button onclick="refreshInicio()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 bg-white border border-slate-200 rounded-lg text-xs font-semibold text-slate-700 hover:bg-slate-50">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-slate-500"></i> Actualizar
          </button>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <div class="flex flex-wrap items-center gap-2.5">
            <div class="flex items-center gap-2 mr-1">
              <i data-lucide="users" class="w-4 h-4 text-slate-700"></i>
              <h2 class="text-[16px] font-bold text-slate-900">Mis Clientes</h2>
              <button onclick="showToast('Haz clic en cualquier cliente para ver su historial y saldo pendiente')" class="w-6 h-6 rounded-full bg-[#E9F5D8] text-[#4D7C1F] flex items-center justify-center hover:scale-105 transition-transform">
                <i data-lucide="play" class="w-3 h-3 fill-current"></i>
              </button>
            </div>

            <div class="relative">
              <i data-lucide="search" class="w-3.5 h-3.5 text-slate-400 absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input
                type="text"
                value="${state.clientSearch}"
                oninput="updateClientSearch(this.value)"
                placeholder="Buscar por nombre, cédula, teléfon"
                class="pl-8 pr-3 py-1.5 w-60 bg-white border border-slate-200/90 rounded-lg text-xs text-slate-700 placeholder:text-slate-400 focus:outline-none focus:border-[#84CC16]"
              />
            </div>

            <div class="bg-white border border-slate-200/80 rounded-lg px-3 py-1 flex items-center gap-2 shadow-2xs">
              <span class="w-6 h-6 rounded-md bg-[#E9F5D8] text-[#4D7C1F] flex items-center justify-center">
                <i data-lucide="users" class="w-3.5 h-3.5"></i>
              </span>
              <div class="leading-none">
                <div class="text-xs font-extrabold text-slate-900">${state.clients.length}</div>
                <div class="text-[9px] font-bold uppercase text-slate-400 mt-0.5">TOTAL</div>
              </div>
            </div>

            <div class="bg-white border border-slate-200/80 rounded-lg px-3 py-1 flex items-center gap-2 shadow-2xs">
              <span class="w-6 h-6 rounded-md bg-emerald-50 text-emerald-600 flex items-center justify-center">
                <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
              </span>
              <div class="leading-none">
                <div class="text-xs font-extrabold text-slate-900">${frequentCount}</div>
                <div class="text-[9px] font-bold uppercase text-slate-400 mt-0.5">FRECUENTES</div>
              </div>
            </div>

            <div class="bg-white border border-slate-200/80 rounded-lg px-3 py-1 flex items-center gap-2 shadow-2xs">
              <span class="w-6 h-6 rounded-md bg-purple-50 text-purple-600 flex items-center justify-center">
                <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
              </span>
              <div class="leading-none">
                <div class="text-xs font-extrabold text-slate-900">${posCount}</div>
                <div class="text-[9px] font-bold uppercase text-slate-400 mt-0.5">CLIENTES POS</div>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="showToast('Selecciona un archivo .CSV para importar clientes')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#E9F5D8]/70 hover:bg-[#E9F5D8] text-[#2F5211] font-semibold text-xs transition-colors">
              <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5 text-[#4D7C1F]"></i> Importar CSV
            </button>
            <button onclick="exportClientsCSV()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-[#E9F5D8]/70 hover:bg-[#E9F5D8] text-[#2F5211] font-semibold text-xs transition-colors">
              <i data-lucide="download" class="w-3.5 h-3.5 text-[#4D7C1F]"></i> Exportar
            </button>
            <button onclick="cleanDuplicateClients()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-50 hover:bg-amber-100/80 text-amber-700 font-semibold text-xs transition-colors">
              <i data-lucide="git-merge" class="w-3.5 h-3.5 text-amber-600"></i> Limpiar Duplicados
            </button>
            <button onclick="openNewClientModal()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#84CC16] hover:bg-[#73B312] text-slate-950 font-bold text-xs shadow-2xs transition-colors">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nuevo Cliente
            </button>
          </div>
        </div>

        <div class="px-5 pb-2 flex items-center text-[10px] font-bold uppercase tracking-wider text-slate-400">
          <div class="w-1/3 min-w-[180px]">CLIENTE</div>
          <div class="w-1/4">IDENTIFICACIÓN</div>
          <div class="flex-1">TELÉFONO</div>
        </div>

        <div class="space-y-2.5">
          ${rowsHtml}
        </div>
      `;
    }

    function updateClientSearch(val) {
      state.clientSearch = val;
      saveState();
      renderWorkspace();
      const input = document.querySelector('input[placeholder*="Buscar por nombre"]');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function exportClientsCSV() {
      const csv = ['Nombre,Documento,Telefono,Correo,Direccion']
        .concat(state.clients.map(c => `"${c.fullName}","${c.docNumber || ''}","${c.phone || ''}","${c.email || ''}","${c.address || ''}"`))
        .join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'clientes_tesla_tech.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Listado de clientes exportado en CSV');
    }

    function cleanDuplicateClients() {
      const seen = new Set();
      const unique = [];
      let removed = 0;
      for (const c of state.clients) {
        const key = `${c.fullName.trim().toLowerCase()}|${(c.phone || '').trim()}`;
        if (seen.has(key)) removed++;
        else {
          seen.add(key);
          unique.push(c);
        }
      }
      state.clients = unique;
      saveState();
      renderWorkspace();
      showToast(removed > 0 ? `Se eliminaron ${removed} duplicados` : 'No se encontraron clientes duplicados');
    }

    function openNewClientModal(editingClientId = null) {
      const existing = editingClientId ? state.clients.find(c => c.id === editingClientId) : null;
      state.newClientType = existing ? (existing.type || 'Persona') : 'Persona';
      state.newClientDocType = existing ? (existing.docType || 'CC') : 'CC';
      const isEmpresa = state.newClientType === 'Empresa';

      openQuickModal(`
        <div class="flex items-start justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-[#E9F5D8] text-[#4D7C1F] flex items-center justify-center shrink-0">
              <i data-lucide="user-plus" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="font-bold text-base text-slate-900 leading-tight">${existing ? 'Editar Cliente' : 'Nuevo Cliente'}</h3>
              <p class="text-xs text-slate-400 mt-0.5">Queda guardado para la próxima orden o venta</p>
            </div>
          </div>
          <button onclick="closeQuickModal()" class="p-1 text-slate-400 hover:text-slate-600 rounded-lg hover:bg-slate-100">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="grid grid-cols-2 gap-1.5 bg-slate-100/90 p-1 rounded-xl mb-4 text-xs font-bold">
          <button type="button" onclick="setClientModalType('Persona')" class="py-2 rounded-lg transition-all ${!isEmpresa ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500'}">Persona</button>
          <button type="button" onclick="setClientModalType('Empresa')" class="py-2 rounded-lg transition-all ${isEmpresa ? 'bg-white text-slate-900 shadow-2xs' : 'text-slate-500'}">Empresa</button>
        </div>

        <form onsubmit="submitClientForm(event, '${existing ? existing.id : ''}')" class="space-y-3.5 text-xs">
          ${!isEmpresa
            ? `<div class="grid grid-cols-2 gap-3">
                 <div>
                   <label class="block font-bold text-slate-800 mb-1">Nombre *</label>
                   <input id="nc-first" type="text" value="${existing ? (existing.firstName || '') : ''}" placeholder="Ej. María" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#84CC16]" required />
                 </div>
                 <div>
                   <label class="block font-bold text-slate-800 mb-1">Apellido *</label>
                   <input id="nc-last" type="text" value="${existing ? (existing.lastName || '') : ''}" placeholder="Ej. Pérez" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#84CC16]" required />
                 </div>
               </div>`
            : `<div>
                 <label class="block font-bold text-slate-800 mb-1">Razón Social / Empresa *</label>
                 <input id="nc-company" type="text" value="${existing ? existing.fullName : ''}" placeholder="Ej. Inversiones Tech SAS" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#84CC16]" required />
               </div>`
          }

          <div>
            <label class="block font-bold text-slate-800 mb-1">Teléfono</label>
            <div class="flex items-center gap-2">
              <span class="px-3 py-2.5 rounded-xl bg-slate-50 border border-slate-200 font-extrabold text-[#4D7C1F] shrink-0">+57</span>
              <input id="nc-phone" type="text" value="${existing ? (existing.phone || '').replace(/^\+57/, '') : ''}" placeholder="4141234567" class="flex-1 px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#84CC16]" />
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-800 mb-1.5">Tipo de documento</label>
            <div class="flex items-center gap-2">
              ${['CC', 'CE', 'Pasaporte'].map(dt => `
                <button type="button" onclick="setClientModalDocType('${dt}')" class="px-3.5 py-1.5 rounded-lg border text-xs font-bold transition-colors ${
                  state.newClientDocType === dt
                    ? 'border-[#84CC16] bg-[#F2FCE2] text-[#2F5211]'
                    : 'border-slate-200 bg-white text-slate-600 hover:bg-slate-50'
                }">${dt}</button>
              `).join('')}
            </div>
          </div>

          <div>
            <label class="block font-bold text-slate-800 mb-1">${state.newClientDocType}</label>
            <input id="nc-doc-num" type="text" value="${existing ? (existing.docNumber || '') : ''}" placeholder="1023456789" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#84CC16]" />
          </div>

          <div>
            <label class="block font-bold text-slate-800 mb-1">Correo</label>
            <input id="nc-email" type="email" value="${existing ? (existing.email || '') : ''}" placeholder="cliente@correo.com" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#84CC16]" />
          </div>

          <div>
            <label class="block font-bold text-slate-800 mb-1">Dirección</label>
            <input id="nc-address" type="text" value="${existing ? (existing.address || '') : ''}" placeholder="Opcional" class="w-full px-3 py-2.5 border border-slate-200 rounded-xl focus:outline-none focus:border-[#84CC16]" />
          </div>

          <button type="submit" class="mt-2 w-full py-3 rounded-xl bg-[#A3E635] hover:bg-[#84CC16] text-slate-900 font-bold text-sm transition-colors shadow-2xs">
            ${existing ? 'Actualizar Cliente' : 'Guardar Cliente'}
          </button>
        </form>
      `);
      lucide.createIcons();
    }

    function setClientModalType(type) {
      state.newClientType = type;
      openNewClientModal(state.selectedClientId);
    }

    function setClientModalDocType(dt) {
      state.newClientDocType = dt;
      openNewClientModal(state.selectedClientId);
    }

    function submitClientForm(e, editId) {
      e.preventDefault();
      const rawPhone = (document.getElementById('nc-phone')?.value || '').trim();
      const phone = rawPhone ? (rawPhone.startsWith('+') ? rawPhone : '+57' + rawPhone) : '';
      let firstName = '', lastName = '', fullName = '';

      if (state.newClientType === 'Empresa') {
        fullName = (document.getElementById('nc-company')?.value || '').trim();
        firstName = fullName;
      } else {
        firstName = (document.getElementById('nc-first')?.value || '').trim();
        lastName = (document.getElementById('nc-last')?.value || '').trim();
        fullName = `${firstName} ${lastName}`.trim();
      }
      if (!fullName) return;

      const docNumber = (document.getElementById('nc-doc-num')?.value || '').trim();
      const email = (document.getElementById('nc-email')?.value || '').trim();
      const address = (document.getElementById('nc-address')?.value || '').trim();

      if (editId) {
        const cli = state.clients.find(c => c.id === editId);
        if (cli) {
          Object.assign(cli, {
            type: state.newClientType, firstName, lastName, fullName,
            initials: getInitials(fullName), phone, docType: state.newClientDocType,
            docNumber, email, address
          });
        }
        showToast('Cliente actualizado');
      } else {
        state.clients.unshift({
          id: 'cli-' + Date.now(), type: state.newClientType, firstName, lastName, fullName,
          initials: getInitials(fullName), avatarBg: 'bg-emerald-100/80 text-emerald-700',
          phone, docType: state.newClientDocType, docNumber, email, address,
          conflictive: false, isPosClient: false
        });
        showToast(`Cliente "${fullName}" guardado`);
      }

      saveState();
      closeQuickModal();
      renderWorkspace();
    }

    function openClientDetail(clientId) {
      state.selectedClientId = clientId;
      saveState();
      renderWorkspace();
    }

    function backToClientsList() {
      state.selectedClientId = null;
      saveState();
      renderWorkspace();
    }

    function toggleClientConflictive(clientId) {
      const cli = state.clients.find(c => c.id === clientId);
      if (!cli) return;
      cli.conflictive = !cli.conflictive;
      saveState();
      renderWorkspace();
      showToast(cli.conflictive ? 'Marcado como Cliente conflictivo' : 'Marca removida');
    }

    function deleteClientById(clientId) {
      const cli = state.clients.find(c => c.id === clientId);
      if (!cli) return;
      state.clients = state.clients.filter(c => c.id !== clientId);
      state.selectedClientId = null;
      saveState();
      renderWorkspace();
      showToast(`Cliente "${cli.fullName}" eliminado`);
    }

    function renderClientDetailView() {
      const cli = state.clients.find(c => c.id === state.selectedClientId);
      if (!cli) {
        state.selectedClientId = null;
        return renderClientesListView();
      }

      const clientOrders = getClientOrders(cli);
      const pendingSum = clientOrders.reduce((acc, o) => {
        const extra = (o.extraQuotes || []).reduce((s, q) => s + q.amount, 0);
        return acc + Math.max(0, ((o.priceTotal || 0) + extra) - (o.paidAmount || 0));
      }, 0);
      const lastOrderDate = clientOrders.length > 0 ? clientOrders[0].receivedDate.split(' ').slice(0, 2).join(' ') : '—';

      const ordersHtml = clientOrders.length === 0
        ? `<div class="bg-white rounded-2xl border border-slate-200/70 p-8 text-center text-xs text-slate-400">Este cliente aún no tiene órdenes registradas.</div>`
        : clientOrders.map(o => {
            const globalIdx = state.orders.indexOf(o);
            const extra = (o.extraQuotes || []).reduce((s, q) => s + q.amount, 0);
            const total = (o.priceTotal || 0) + extra;
            const pend = Math.max(0, total - (o.paidAmount || 0));
            return `
              <div onclick="openOrderDetail(${globalIdx})" class="bg-white hover:border-[#84CC16] border border-slate-200/70 rounded-2xl p-4 flex items-center justify-between gap-4 cursor-pointer transition-all shadow-2xs">
                <div class="flex items-start gap-3.5">
                  <div class="w-9 h-9 rounded-xl bg-slate-100 text-slate-500 flex items-center justify-center shrink-0 mt-0.5">
                    <i data-lucide="smartphone" class="w-4 h-4"></i>
                  </div>
                  <div>
                    <div class="font-bold text-sm text-slate-900 leading-tight">${o.device}</div>
                    <div class="text-[11px] text-slate-400 mt-0.5">#${o.number} · ${o.receivedDate}</div>
                    <span class="inline-block mt-2 px-2.5 py-0.5 rounded-md bg-sky-50 text-sky-600 font-bold text-[10px] tracking-wide">${(STEPS[o.statusIndex] || 'Recibido').toUpperCase()}</span>
                  </div>
                </div>
                <div class="flex items-center gap-3 text-right">
                  <div>
                    <div class="text-sm font-extrabold text-slate-900">${formatCOP(total)}</div>
                    ${pend > 0 ? `<div class="text-[11px] font-bold text-rose-500 mt-0.5">Debe ${formatCOP(pend)}</div>` : `<div class="text-[11px] font-semibold text-emerald-600 mt-0.5">Pagado</div>`}
                  </div>
                  <i data-lucide="chevron-right" class="w-4 h-4 text-slate-300"></i>
                </div>
              </div>
            `;
          }).join('');

      return `
        <div class="flex items-center justify-between gap-4 mb-5">
          <div class="flex items-center gap-3">
            <button onclick="backToClientsList()" class="p-1.5 rounded-lg text-slate-700 hover:bg-white transition-colors">
              <i data-lucide="arrow-left" class="w-4 h-4"></i>
            </button>
            <div class="w-8 h-8 rounded-lg bg-[#E9F5D8] text-[#4D7C1F] flex items-center justify-center">
