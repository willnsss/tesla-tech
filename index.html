<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TESLA TECH — Gestión de Taller y POS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-app: #F4F7FA;
      --bg-surface: #FFFFFF;
      --bg-subtle: #F8FAFC;
      --bg-muted: #F1F5F9;
      --border-subtle: #E2E8F0;
      --text-primary: #0F172A;
      --text-secondary: #475569;
      --text-muted: #94A3B8;
      --nav-active-bg: #E9F5D8;
      --nav-active-text: #2F5211;
      --accent-lime: #84CC16;
      --accent-lime-hover: #73B312;
      --accent-soft-bg: #F2FCE2;
      --accent-soft-border: #D4F097;
    }

    html.dark {
      --bg-app: #0A0E14;
      --bg-surface: #121721;
      --bg-subtle: #161C28;
      --bg-muted: #1E2533;
      --border-subtle: #232B3B;
      --text-primary: #F1F5F9;
      --text-secondary: #CBD5E1;
      --text-muted: #64748B;
      --nav-active-bg: #1B2818;
      --nav-active-text: #A3E635;
      --accent-lime: #84CC16;
      --accent-lime-hover: #9BE324;
      --accent-soft-bg: #152214;
      --accent-soft-border: #2B451B;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-primary);
      margin: 0;
      overflow-x: hidden;
      transition: background-color 0.2s ease, color 0.2s ease;
    }

    .app-surface {
      background-color: var(--bg-surface);
      border-color: var(--border-subtle);
    }

    .app-subtle {
      background-color: var(--bg-subtle);
      border-color: var(--border-subtle);
    }

    .app-muted {
      background-color: var(--bg-muted);
    }

    .app-border {
      border-color: var(--border-subtle);
    }

    .text-main { color: var(--text-primary); }
    .text-sec { color: var(--text-secondary); }
    .text-dim { color: var(--text-muted); }

    .nav-active {
      background-color: var(--nav-active-bg);
      color: var(--nav-active-text);
    }

    .accent-soft {
      background-color: var(--accent-soft-bg);
      border-color: var(--accent-soft-border);
    }

    input, textarea, select {
      background-color: var(--bg-surface);
      color: var(--text-primary);
      border-color: var(--border-subtle);
    }

    html.dark input::placeholder,
    html.dark textarea::placeholder {
      color: #64748B;
    }

    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #475569; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #64748B; }

    @media print {
      body * { visibility: hidden !important; }
      #quote-doc-modal, #quote-doc-modal * { visibility: visible !important; }
      #quote-doc-modal {
        position: fixed !important;
        inset: 0 !important;
        background: #FFFFFF !important;
        padding: 0 !important;
        overflow: visible !important;
      }
      .no-print { display: none !important; }
      #quote-paper-sheet {
        box-shadow: none !important;
        border: none !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body class="flex h-screen overflow-hidden select-none">

  <!-- =========================================================
       SIDEBAR IZQUIERDO (MENÚ PRINCIPAL)
  ========================================================== -->
  <aside id="main-sidebar" class="w-60 app-surface border-r flex flex-col h-full shrink-0 z-20 transition-colors">
    <div class="h-16 px-4 flex items-center gap-3 shrink-0">
      <div class="w-8 h-8 rounded-lg bg-[#A3E635] flex items-center justify-center text-[#1B2E08] font-bold text-base shadow-2xs">
        T
      </div>
      <span id="brand-name-sidebar" class="font-bold text-[15px] tracking-tight text-main uppercase">TESLA TECH</span>
    </div>

    <nav id="main-nav" class="flex-1 overflow-y-auto px-3 py-2 space-y-5 text-[13px]">
      <div class="space-y-0.5">
        <button onclick="navigate('inicio')" data-nav="inicio" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-sec hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="home" class="w-4 h-4 text-dim"></i> Inicio</span>
        </button>
        <button onclick="navigate('recibir')" data-nav="recibir" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-sec hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="plus" class="w-4 h-4 text-dim"></i> Recibir</span>
        </button>
        <button onclick="navigate('clientes')" data-nav="clientes" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-sec hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
          <span class="flex items-center gap-3"><i data-lucide="users" class="w-4 h-4 text-dim"></i> Clientes</span>
        </button>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-dim uppercase">Operación</div>
        <div class="space-y-0.5" id="nav-operacion"></div>
      </div>

      <div>
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-dim uppercase">Punto de Venta</div>
        <div class="space-y-0.5" id="nav-pos"></div>
      </div>

      <div class="pb-4">
        <div class="px-3 mb-1.5 text-[10px] font-semibold tracking-wider text-dim uppercase">Administración</div>
        <div class="space-y-0.5">
          <button onclick="navigate('equipo')" data-nav="equipo" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-sec hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
            <span class="flex items-center gap-3"><i data-lucide="user-plus" class="w-4 h-4 text-dim"></i> Mi Equipo</span>
          </button>
          <button onclick="navigate('ajustes')" data-nav="ajustes" class="nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-sec hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
            <span class="flex items-center gap-3"><i data-lucide="settings" class="w-4 h-4 text-dim"></i> Ajustes</span>
          </button>
        </div>
      </div>
    </nav>
  </aside>

  <!-- =========================================================
       CONTENEDOR PRINCIPAL DERECHO
  ========================================================== -->
  <div class="flex-1 flex flex-col h-full min-w-0">
    <main id="workspace" class="flex-1 overflow-y-auto px-7 py-5"></main>
  </div>

  <!-- =========================================================
       VISTA FULLSCREEN DE DETALLE DE ORDEN
  ========================================================== -->
  <div id="order-detail-overlay" class="fixed inset-0 bg-[var(--bg-app)] z-40 hidden flex-col overflow-hidden transition-colors">
    <div id="order-detail-header" class="app-surface border-b px-5 py-3 flex flex-wrap items-center justify-between gap-3 shrink-0"></div>
    <div id="order-detail-body" class="flex-1 overflow-y-auto px-6 py-4 space-y-4"></div>
  </div>

  <!-- =========================================================
       VISTA DE DOCUMENTO / RECIBO / PDF DE PRESUPUESTO
  ========================================================== -->
  <div id="quote-doc-modal" class="fixed inset-0 bg-[#EEF2F6] dark:bg-[#0A0E14] z-50 hidden flex-col overflow-y-auto">
    <div id="quote-doc-content" class="max-w-3xl w-full mx-auto px-4 py-6 space-y-4"></div>
  </div>

  <!-- =========================================================
       MODAL RÁPIDO GENÉRICO
  ========================================================== -->
  <div id="quick-action-modal" class="fixed inset-0 bg-slate-950/60 backdrop-blur-[2px] hidden items-center justify-center z-50 p-4">
    <div id="quick-action-content" class="app-surface border rounded-2xl max-w-md w-full p-6 shadow-xl max-h-[92vh] overflow-y-auto"></div>
  </div>

  <!-- Toast Notification -->
  <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 dark:bg-slate-800 border border-slate-700/60 text-white text-xs font-medium px-4 py-3 rounded-xl shadow-lg transform translate-y-20 opacity-0 transition-all duration-300 z-50 flex items-center gap-2">
    <i data-lucide="check-circle-2" class="w-4 h-4 text-[#84CC16]"></i>
    <span id="toast-msg">Acción completada</span>
  </div>

  <!-- =========================================================
       JAVASCRIPT DE LA APLICACIÓN
  ========================================================== -->
  <script>

        {
          id: 'pr-1',
          code: '#PR-00001',
          date: '25 nov 2026',
          status: 'PENDIENTE',
          clientType: 'Persona',
          firstName: 'WILLIAM JOSE TADEO',
          lastName: 'LAZARO DIAZ',
          fullName: 'WILLIAM JOSE TADEO LAZARO DIAZ',
          docType: 'CE',
          docNumber: '704882',
          phone: '+57 3206745333',
          email: 'will.lazaro@gmail.com',
          brand: '',
          model: '',
          serial: '',
          workDescription: '',

            { id: 'item-1', name: 'cambio bateria', type: 'Servicio', price: 250000, qty: 1 }
          ],
          discount: 0,
          notes: '',
          issuedBy: ''
        }
      ]
    };

    const quoteDraft = {
      clientType: 'Persona',
      docType: 'CE',
      firstName: 'WILLIAM JOSE TADEO',
      lastName: 'LAZARO DIAZ',
      docNumber: '704882',
      phone: '3206745333',
      email: 'will.lazaro@gmail.com',
      brand: '',
      model: '',
      serial: '',
      workDescription: '',
      productTab: 'Servicio',
      productSearch: 'cambio bateria iphone 14 pro',
      items: [
        { id: 'draft-item-1', name: 'cambio bateria', type: 'Servicio', price: 250000, qty: 1 }
      ],
      discount: 0,
      notes: '',
      issuedBy: ''
    };

    const receiveFormState = {
      clientMode: 'Persona',
      docType: 'CC',
      modality: 'En el taller',
      showPass: false,
      passPatternMode: false,
      accessoriesChecked: [],
      customAccessories: [],
      checklistItems: [],
      services: [],
      orderExpenses: [],
      warrantyDays: 30,
      photosCount: 0
    };

    function loadState() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return { ...defaultState, ...JSON.parse(saved) };
      } catch (e) {}
      return JSON.parse(JSON.stringify(defaultState));
    }

    const state = loadState();

    function applyTheme() {
      document.documentElement.classList.toggle('dark', !!state.darkMode);
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      } catch (e) {}
    }

    const operationItems = [
      { id: 'inventario', label: 'Inventario', icon: 'package', locked: true },
      { id: 'reposicion', label: 'Reposición', icon: 'clipboard-check', locked: true },
      { id: 'presupuestos', label: 'Presupuestos', icon: 'file-text', locked: false },
      { id: 'garantias', label: 'Garantías y Abandonos', icon: 'alert-triangle', locked: true },
      { id: 'estadisticas', label: 'Estadísticas', icon: 'pie-chart', locked: true },
      { id: 'historial', label: 'Historial', icon: 'history', locked: true },
      { id: 'visitas', label: 'Visitas a domicilio', icon: 'calendar', locked: true },
      { id: 'ingresos', label: 'Ingresos y Gastos', icon: 'dollar-sign', locked: true },
      { id: 'corte', label: 'Corte de Caja', icon: 'archive', locked: true },
      { id: 'auditoria', label: 'Auditoria POS', icon: 'shield-check', locked: true },
      { id: 'reportes', label: 'Reportes', icon: 'file-spreadsheet', locked: true },
      { id: 'comisiones', label: 'Comisiones', icon: 'coins', locked: true }
    ];

    const posItems = [
      { id: 'pos', label: 'Punto de Venta', icon: 'shopping-cart', locked: true },
      { id: 'cobrar', label: 'Cuentas por Cobrar', icon: 'arrow-down-left', locked: true },
      { id: 'pagar', label: 'Cuentas por Pagar', icon: 'file-minus', locked: true },
      { id: 'recibos', label: 'Recibos POS', icon: 'receipt', locked: true }
    ];

    function formatCOP(val) {
      if (state.hideAmounts) return 'COP ••••••';
      return 'COP ' + Number(val || 0).toLocaleString('es-CO');
    }

    function maskPhoneForDoc(phone) {
      const clean = (phone || '').replace(/\D/g, '');
      if (clean.length >= 4) {
        return `+57 ••• ••• ${clean.slice(-4)}`;
      }
      return phone || '+57 ••• ••• ••••';
    }

    function getInitials(name) {
      const parts = (name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length === 0) return 'CL';
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
    }

    function getClientOrders(client) {
      return state.orders.filter(o =>
        (client.id && o.clientId === client.id) ||
        (o.client && o.client.name && o.client.name.toLowerCase() === client.fullName.toLowerCase())
      );
    }

    // =========================================================
    // SIDEBAR Y NAVEGACIÓN
    // =========================================================
    function renderSidebar() {
      const renderGroup = (items, containerId) => {
        const container = document.getElementById(containerId);
        container.innerHTML = items.map(item => {
          const isActive = state.activeRoute === item.id;
          return `
            <button onclick="navigate('${item.id}')"
              class="w-full flex items-center justify-between px-3 py-2 rounded-lg transition-colors ${
                isActive
                  ? 'nav-active font-semibold'
                  : item.locked
                    ? 'text-dim hover:bg-black/5 dark:hover:bg-white/5'
                    : 'text-sec hover:bg-black/5 dark:hover:bg-white/5'
              }">
              <span class="flex items-center gap-3 truncate">
                <i data-lucide="${item.icon}" class="w-4 h-4 shrink-0 ${isActive ? 'text-[#84CC16]' : 'text-dim'}"></i>
                <span class="truncate">${item.label}</span>
              </span>
              ${item.locked ? `<i data-lucide="lock" class="w-3 h-3 text-dim/70 shrink-0"></i>` : ''}
            </button>
          `;
        }).join('');
      };

      renderGroup(operationItems, 'nav-operacion');
      renderGroup(posItems, 'nav-pos');

      document.querySelectorAll('.nav-item').forEach(btn => {
        const route = btn.getAttribute('data-nav');
        const icon = btn.querySelector('i');
        if (route === state.activeRoute) {
          btn.className = 'nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg nav-active font-semibold transition-colors';
          if (icon) icon.classList.replace('text-dim', 'text-[#84CC16]');
        } else {
          btn.className = 'nav-item w-full flex items-center justify-between px-3 py-2 rounded-lg text-sec hover:bg-black/5 dark:hover:bg-white/5 transition-colors';
          if (icon) icon.classList.replace('text-[#84CC16]', 'text-dim');
        }
      });

      lucide.createIcons();
    }

    function navigate(routeId) {
      state.activeRoute = routeId;
      if (routeId !== 'clientes') state.selectedClientId = null;
      if (routeId === 'presupuestos') state.quoteFormOpen = true;
      saveState();
      renderSidebar();
      renderWorkspace();
    }

    function renderWorkspace() {
      applyTheme();
      const ws = document.getElementById('workspace');

      if (state.activeRoute === 'inicio') {
        ws.innerHTML = renderInicioScreen();
      } else if (state.activeRoute === 'recibir') {
        ws.innerHTML = renderRecibirScreen();
      } else if (state.activeRoute === 'clientes') {
        ws.innerHTML = state.selectedClientId ? renderClientDetailView() : renderClientesListView();
      } else if (state.activeRoute === 'presupuestos') {
        ws.innerHTML = renderPresupuestosScreen();
      } else {
        const allItems = [...operationItems, ...posItems];
        const found = allItems.find(i => i.id === state.activeRoute);
        ws.innerHTML = `
          <div class="flex items-center justify-between mb-6">
            <h1 class="text-xl font-bold text-main">${found ? found.label : state.activeRoute}</h1>
            <button onclick="navigate('inicio')" class="px-3.5 py-1.5 app-surface border rounded-lg text-xs font-semibold text-sec hover:opacity-90">
              Volver a Inicio
            </button>
          </div>
          <div class="app-surface rounded-2xl border p-6 text-xs text-dim">
            Sección <strong>${found ? found.label : state.activeRoute}</strong> lista para continuar.
          </div>
        `;
      }

      lucide.createIcons();
      if (state.activeRoute === 'recibir') updateMissingBadges();
    }

    // =========================================================
    // PRESUPUESTOS (NUEVO PRESUPUESTO + RECIBO / PDF)
    // =========================================================
    function calcQuoteTotals(items, discount) {
      const subtotal = (items || []).reduce((acc, it) => acc + (Number(it.price || 0) * Number(it.qty || 1)), 0);
      const total = Math.max(0, subtotal - Number(discount || 0));
      return { subtotal, total };
    }

    function renderPresupuestosScreen() {
      const { subtotal, total } = calcQuoteTotals(quoteDraft.items, quoteDraft.discount);

      const itemsHtml = quoteDraft.items.length === 0
        ? `<div class="py-4 text-center text-xs text-dim">Agrega un servicio o repuesto para calcular el presupuesto.</div>`
        : quoteDraft.items.map(it => {
            const lineTotal = Number(it.price || 0) * Number(it.qty || 1);
            return `
              <div class="app-subtle border rounded-xl px-4 py-3 flex items-center justify-between gap-3">
                <div>
                  <div class="text-xs font-bold text-main">${it.name}</div>
                  <div class="text-[11px] text-dim mt-0.5">${formatCOP(it.price)} × ${it.qty}</div>
                </div>
                <div class="flex items-center gap-3">
                  <div class="flex items-center gap-1.5">
                    <button type="button" onclick="changeDraftItemQty('${it.id}', -1)" class="w-6 h-6 rounded-md app-muted hover:opacity-80 flex items-center justify-center text-main font-bold text-xs">-</button>
                    <span class="w-5 text-center text-xs font-bold text-main">${it.qty}</span>
                    <button type="button" onclick="changeDraftItemQty('${it.id}', 1)" class="w-6 h-6 rounded-md app-muted hover:opacity-80 flex items-center justify-center text-main font-bold text-xs">+</button>
                  </div>
                  <div class="text-xs font-extrabold text-[#84CC16] min-w-[85px] text-right">${formatCOP(lineTotal)}</div>
                  <button type="button" onclick="removeDraftItem('${it.id}')" class="text-rose-500 hover:text-rose-400 p-1">
                    <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            `;
          }).join('');

      const savedQuotesHtml = state.quotes.map(q => {
        const qTotals = calcQuoteTotals(q.items, q.discount);
        const badgeStyle = q.status === 'APROBADO'
          ? 'bg-emerald-500/15 text-emerald-500 border-emerald-500/30'
          : q.status === 'RECHAZADO'
            ? 'bg-rose-500/15 text-rose-500 border-rose-500/30'
            : 'bg-amber-400/20 text-amber-500 border-amber-400/30';

        return `
          <div onclick="openQuoteDocument('${q.id}')" class="app-surface hover:border-[#84CC16] border rounded-xl px-4 py-3 flex items-center justify-between gap-4 cursor-pointer transition-colors shadow-2xs">
            <div>
              <div class="flex items-center gap-2">
                <span class="text-xs font-extrabold text-main">${q.code}</span>
                <span class="text-xs font-semibold text-sec">· ${q.fullName}</span>
                <span class="px-2 py-0.5 rounded text-[10px] font-bold border ${badgeStyle}">${q.status}</span>
              </div>
              <div class="text-[11px] text-dim mt-0.5">${q.date} · ${(q.items || []).map(i => i.name).join(', ') || 'Sin ítems'}</div>
            </div>
            <div class="flex items-center gap-3">
              <div class="text-right">
                <div class="text-xs font-extrabold text-[#84CC16]">${formatCOP(qTotals.total)}</div>
                <div class="text-[10px] text-dim">Ver / PDF</div>
              </div>
              <i data-lucide="file-text" class="w-4 h-4 text-[#84CC16]"></i>
            </div>
          </div>
        `;
      }).join('');

      return `
        <div class="space-y-4 pb-20">
          <!-- Cabecera superior -->
          <div class="flex items-center justify-between gap-3">
            <div class="flex items-center gap-3">
              <button type="button" onclick="navigate('inicio')" class="p-1.5 rounded-lg text-sec hover:bg-black/5 dark:hover:bg-white/5 transition-colors">
                <i data-lucide="arrow-left" class="w-4 h-4"></i>
              </button>
              <div class="w-8 h-8 rounded-lg bg-[#84CC16] text-slate-950 flex items-center justify-center shrink-0">
                <i data-lucide="file-text" class="w-4 h-4"></i>
              </div>
              <div>
                <h1 class="text-[17px] font-extrabold text-main leading-tight">Nuevo Presupuesto</h1>
                <p class="text-[11px] text-dim">Crea un presupuesto para tu cliente</p>
              </div>
            </div>

            <button type="button" onclick="openQuoteDocument(state.quotes[0]?.id)" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg accent-soft border text-[#84CC16] font-bold text-xs transition-colors">
              <i data-lucide="printer" class="w-3.5 h-3.5"></i> Ver último PDF
            </button>
          </div>

          <!-- Bloque 1: Cliente -->
          <div class="app-surface rounded-2xl border p-5 shadow-2xs space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg accent-soft text-[#84CC16] flex items-center justify-center shrink-0">
                <i data-lucide="user" class="w-4 h-4"></i>
              </div>
              <div>
                <h2 class="text-sm font-bold text-main leading-tight">Cliente</h2>
                <p class="text-[11px] text-dim">Búscalo si ya vino antes, o cárgalo nuevo</p>
              </div>
            </div>

            <div class="relative">
              <i data-lucide="search" class="w-3.5 h-3.5 text-dim absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input
                type="text"
                oninput="autofillQuoteFromClientQuery(this.value)"
                placeholder="Buscar cliente por nombre, cédula o teléfono..."
                class="w-full pl-9 pr-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]"
              />
            </div>

            <div class="grid grid-cols-2 app-muted p-1 rounded-xl text-xs font-bold">
              <button type="button" onclick="quoteDraft.clientType='Persona'; renderWorkspace();" class="py-2 rounded-lg transition-all ${quoteDraft.clientType === 'Persona' ? 'app-surface text-main shadow-2xs' : 'text-dim'}">Persona</button>
              <button type="button" onclick="quoteDraft.clientType='Empresa'; renderWorkspace();" class="py-2 rounded-lg transition-all ${quoteDraft.clientType === 'Empresa' ? 'app-surface text-main shadow-2xs' : 'text-dim'}">Empresa</button>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-sec mb-1">Nombre <span class="text-rose-500">*</span></label>
                <input id="q-first-name" type="text" value="${quoteDraft.firstName}" oninput="quoteDraft.firstName = this.value" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
              </div>
              <div>
                <label class="block text-xs font-bold text-sec mb-1">Apellido</label>
                <input id="q-last-name" type="text" value="${quoteDraft.lastName}" oninput="quoteDraft.lastName = this.value" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1.5">Tipo de documento</label>
              <div class="flex items-center gap-2">
                ${['CC', 'CE', 'Pasaporte'].map(dt => `
                  <button type="button" onclick="quoteDraft.docType='${dt}'; renderWorkspace();" class="px-3.5 py-1.5 rounded-lg border text-xs font-bold transition-colors ${
                    quoteDraft.docType === dt
                      ? 'border-[#84CC16] accent-soft text-[#84CC16]'
                      : 'app-surface text-sec'
                  }">${dt}</button>
                `).join('')}
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">${quoteDraft.docType}</label>
              <input id="q-doc-number" type="text" value="${quoteDraft.docNumber}" oninput="quoteDraft.docNumber = this.value" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">Teléfono</label>
              <div class="flex items-center gap-2">
                <span class="px-3.5 py-2.5 rounded-xl app-subtle border text-xs font-bold text-sky-400 shrink-0 inline-flex items-center gap-1.5">
                  <i data-lucide="globe" class="w-3.5 h-3.5"></i> +57
                </span>
                <input id="q-phone" type="text" value="${quoteDraft.phone}" oninput="quoteDraft.phone = this.value" class="flex-1 px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">Correo (opcional)</label>
              <input id="q-email" type="email" value="${quoteDraft.email}" oninput="quoteDraft.email = this.value" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
            </div>
          </div>

          <!-- Bloque 2: Equipo y trabajo -->
          <div class="app-surface rounded-2xl border p-5 shadow-2xs space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg accent-soft text-[#84CC16] flex items-center justify-center shrink-0">
                  <i data-lucide="smartphone" class="w-4 h-4"></i>
                </div>
                <div>
                  <h2 class="text-sm font-bold text-main leading-tight">Equipo y trabajo</h2>
                  <p class="text-[11px] text-dim">Opcional: marca, modelo y qué hay que hacerle</p>
                </div>
              </div>
              <i data-lucide="chevron-up" class="w-4 h-4 text-dim"></i>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
              <div>
                <label class="block text-xs font-bold text-sec mb-1">Marca</label>
                <input type="text" value="${quoteDraft.brand}" oninput="quoteDraft.brand = this.value" placeholder="Ej: Samsung" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
              </div>
              <div>
                <label class="block text-xs font-bold text-sec mb-1">Modelo</label>
                <input type="text" value="${quoteDraft.model}" oninput="quoteDraft.model = this.value" placeholder="Ej: A54" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">Serial / IMEI</label>
              <input type="text" value="${quoteDraft.serial}" oninput="quoteDraft.serial = this.value" placeholder="Serial o IMEI" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">Trabajo a realizar</label>
              <textarea rows="3" oninput="quoteDraft.workDescription = this.value" placeholder="Ej: Cambio de pantalla y batería, limpieza de puerto de carga..." class="w-full p-3 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]">${quoteDraft.workDescription}</textarea>
            </div>
          </div>

          <!-- Bloque 3: Productos y Servicios -->
          <div class="app-surface rounded-2xl border p-5 shadow-2xs space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-3">
                <div class="w-8 h-8 rounded-lg accent-soft text-[#84CC16] flex items-center justify-center shrink-0">
                  <i data-lucide="box" class="w-4 h-4"></i>
                </div>
                <div>
                  <h2 class="text-sm font-bold text-main leading-tight">Productos y Servicios</h2>
                  <p class="text-[11px] text-dim">Repuestos del inventario o mano de obra</p>
                </div>
              </div>
              <span class="w-6 h-6 rounded-full bg-[#84CC16] text-slate-950 font-extrabold text-xs flex items-center justify-center">${quoteDraft.items.length}</span>
            </div>

            <div class="grid grid-cols-2 app-muted p-1 rounded-xl text-xs font-bold">
              <button type="button" onclick="quoteDraft.productTab='Inventario'; renderWorkspace();" class="py-2 rounded-lg transition-all ${quoteDraft.productTab === 'Inventario' ? 'app-surface text-main shadow-2xs' : 'text-dim'}">Repuesto de inventario</button>
              <button type="button" onclick="quoteDraft.productTab='Servicio'; renderWorkspace();" class="py-2 rounded-lg transition-all ${quoteDraft.productTab === 'Servicio' ? 'app-surface text-main shadow-2xs' : 'text-dim'}">Servicio</button>
            </div>

            <div class="relative">
              <i data-lucide="search" class="w-3.5 h-3.5 text-dim absolute left-3.5 top-1/2 -translate-y-1/2"></i>
              <input type="text" value="${quoteDraft.productSearch}" oninput="quoteDraft.productSearch = this.value" class="w-full pl-9 pr-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1.5">Agregar servicio manual</label>
              <div class="grid grid-cols-1 sm:grid-cols-12 gap-2">
                <input id="q-manual-name" type="text" placeholder="Ej: Cambio de pantalla" class="sm:col-span-7 px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
                <input id="q-manual-price" type="number" placeholder="$ Precio" class="sm:col-span-4 px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
                <button type="button" onclick="addQuoteManualService()" class="sm:col-span-1 h-10 rounded-xl app-muted hover:bg-[#84CC16] hover:text-slate-950 text-main font-bold flex items-center justify-center transition-colors">
                  <i data-lucide="plus" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <div class="space-y-2">${itemsHtml}</div>

            <!-- Resumen Subtotal / Total -->
            <div class="rounded-xl border border-[#84CC16] accent-soft p-4 space-y-2">
              <div class="flex items-center justify-between text-xs font-semibold text-sec">
                <span>Subtotal</span>
                <span>${formatCOP(subtotal)}</span>
              </div>
              <div class="flex items-center justify-between text-base font-extrabold text-[#84CC16]">
                <span>Total</span>
                <span>${formatCOP(total)}</span>
              </div>
            </div>
          </div>

          <!-- Bloque 4: Detalles -->
          <div class="app-surface rounded-2xl border p-5 shadow-2xs space-y-4">
            <div class="flex items-center gap-3">
              <div class="w-8 h-8 rounded-lg accent-soft text-[#84CC16] flex items-center justify-center shrink-0">
                <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
              </div>
              <div>
                <h2 class="text-sm font-bold text-main leading-tight">Detalles</h2>
                <p class="text-[11px] text-dim">Descuento, condiciones y quién lo emite</p>
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">Descuento ($)</label>
              <div class="relative">
                <span class="text-xs font-bold text-dim absolute left-3.5 top-1/2 -translate-y-1/2">$</span>
                <input type="number" value="${quoteDraft.discount}" oninput="quoteDraft.discount = Number(this.value || 0); renderWorkspace();" class="w-full pl-7 pr-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
              </div>
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">Notas (opcional)</label>
              <textarea rows="3" oninput="quoteDraft.notes = this.value" placeholder="Condiciones, garantía, observaciones..." class="w-full p-3 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]">${quoteDraft.notes}</textarea>
            </div>

            <div>
              <label class="block text-xs font-bold text-sec mb-1">Firma / Emitido por (opcional)</label>
              <input type="text" value="${quoteDraft.issuedBy}" oninput="quoteDraft.issuedBy = this.value" placeholder="Ej: Juan Pérez — Técnico Principal" class="w-full px-3.5 py-2.5 text-xs border rounded-xl focus:outline-none focus:border-[#84CC16]" />
            </div>
          </div>

          <!-- Presupuestos emitidos -->
          <div class="space-y-2.5">
            <div class="flex items-center justify-between px-1">
              <h3 class="text-xs font-bold text-sec">Presupuestos creados</h3>
              <span class="text-[11px] text-dim">${state.quotes.length} registro(s)</span>
            </div>
            <div class="space-y-2">${savedQuotesHtml}</div>
          </div>

          <!-- Barra inferior fija -->
          <div class="fixed bottom-0 left-60 right-0 app-surface border-t px-7 py-3 flex items-center justify-between gap-4 z-30">
            <div>
              <div class="text-[11px] text-dim font-medium">Total</div>
              <div class="text-base font-extrabold text-main">${formatCOP(total)}</div>
            </div>
            <button type="button" onclick="createAndOpenQuote()" class="inline-flex items-center gap-2 px-5 py-2.5 rounded-xl bg-[#84CC16] hover:bg-[#73B312] text-slate-950 font-bold text-xs shadow-sm transition-colors">
              <i data-lucide="file-plus-2" class="w-4 h-4"></i> Crear Presupuesto
            </button>
          </div>
        </div>
      `;
    }

    function autofillQuoteFromClientQuery(q) {
      const term = (q || '').trim().toLowerCase();
      if (!term) return;
      const match = state.clients.find(c =>
        c.fullName.toLowerCase().includes(term) ||
        (c.phone || '').toLowerCase().includes(term) ||
        (c.docNumber || '').toLowerCase().includes(term)
      );
      if (match) {
        quoteDraft.firstName = match.firstName || match.fullName;
        quoteDraft.lastName = match.lastName || '';
        quoteDraft.docNumber = match.docNumber || '';
        quoteDraft.phone = (match.phone || '').replace(/^\+57\s*/, '');
        quoteDraft.email = match.email || '';
        renderWorkspace();
      }
    }

    function addQuoteManualService() {
      const nameEl = document.getElementById('q-manual-name');
      const priceEl = document.getElementById('q-manual-price');
      const name = (nameEl?.value || '').trim();
      const price = Number(priceEl?.value || 0);
      if (!name || price <= 0) {
        showToast('Ingresa descripción y precio del servicio');
        return;
      }
      quoteDraft.items.push({
        id: 'q-item-' + Date.now(),
        name,
        type: quoteDraft.productTab,
        price,
        qty: 1
      });
      renderWorkspace();
      showToast(`Agregado: ${name}`);
    }

    function changeDraftItemQty(itemId, delta) {
      const item = quoteDraft.items.find(i => i.id === itemId);
      if (!item) return;
      item.qty = Math.max(1, Number(item.qty || 1) + delta);
      renderWorkspace();
    }

    function removeDraftItem(itemId) {
      quoteDraft.items = quoteDraft.items.filter(i => i.id !== itemId);
      renderWorkspace();
    }

    function createAndOpenQuote() {
      const firstName = (quoteDraft.firstName || '').trim();
      if (!firstName) {
        showToast('Completa el Nombre del cliente');
        return;
      }
      const lastName = (quoteDraft.lastName || '').trim();
      const fullName = `${firstName} ${lastName}`.trim();
      const nextIndex = state.quotes.length + 1;
      const code = `#PR-${String(nextIndex).padStart(5, '0')}`;
      const rawPhone = (quoteDraft.phone || '').trim();
      const formattedPhone = rawPhone ? (rawPhone.startsWith('+') ? rawPhone : `+57 ${rawPhone}`) : '+57 3206745333';

      const newQuote = {
        id: 'pr-' + Date.now(),
        code,
        date: '25 nov 2026',
        status: 'PENDIENTE',
        clientType: quoteDraft.clientType,
        firstName,
        lastName,
        fullName,
        docType: quoteDraft.docType,
        docNumber: (quoteDraft.docNumber || '').trim(),
        phone: formattedPhone,
        email: (quoteDraft.email || '').trim(),
        brand: quoteDraft.brand,
        model: quoteDraft.model,
        serial: quoteDraft.serial,
        workDescription: quoteDraft.workDescription,
        items: JSON.parse(JSON.stringify(quoteDraft.items)),
        discount: Number(quoteDraft.discount || 0),
        notes: quoteDraft.notes,
        issuedBy: quoteDraft.issuedBy
      };

      state.quotes.unshift(newQuote);
      saveState();
      renderWorkspace();
      openQuoteDocument(newQuote.id);
      showToast(`Presupuesto ${code} creado`);
    }

    function openQuoteDocument(quoteId) {
      const q = state.quotes.find(item => item.id === quoteId) || state.quotes[0];
      if (!q) return;
      state.selectedQuoteId = q.id;

      const { subtotal, total } = calcQuoteTotals(q.items, q.discount);
      const modal = document.getElementById('quote-doc-modal');
      const container = document.getElementById('quote-doc-content');

      const statusBadgeClass = q.status === 'APROBADO'
        ? 'bg-emerald-100 text-emerald-700'
        : q.status === 'RECHAZADO'
          ? 'bg-rose-100 text-rose-700'
          : 'bg-amber-100/90 text-amber-700';

      const rowsHtml = (q.items || []).map(it => {
        const lineSub = Number(it.price || 0) * Number(it.qty || 1);
        return `
          <tr class="border-b border-slate-200/80 text-xs text-slate-700">
            <td class="py-3 pr-2 font-medium text-slate-800">${it.name}</td>
            <td class="py-3 px-2 text-center">${it.qty}</td>
            <td class="py-3 px-2 text-right">${formatCOP(it.price)}</td>
            <td class="py-3 pl-2 text-right font-bold text-slate-900">${formatCOP(lineSub)}</td>
          </tr>
        `;
      }).join('');

      container.innerHTML = `
        <div class="flex items-center justify-between gap-3 no-print">
          <button type="button" onclick="closeQuoteDocument()" class="inline-flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-white dark:bg-[#121721] border border-slate-200 dark:border-[#232B3B] text-xs font-bold text-slate-700 dark:text-slate-200 hover:opacity-90">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Volver
          </button>

          <button type="button" onclick="window.print()" class="inline-flex items-center gap-2 px-4 py-2 rounded-xl bg-white dark:bg-[#121721] border border-slate-200 dark:border-[#232B3B] text-xs font-bold text-slate-800 dark:text-slate-100 shadow-2xs hover:opacity-90">
            <i data-lucide="printer" class="w-4 h-4"></i> Imprimir / PDF
          </button>
        </div>

        <!-- Hoja blanca tipo recibo / PDF -->
        <div id="quote-paper-sheet" class="bg-white text-slate-900 rounded-2xl border border-slate-200/90 shadow-sm p-7 sm:p-9 space-y-6">
          <div class="flex items-start justify-between gap-4 border-b border-slate-200 pb-6">
            <div class="space-y-3">
              <div class="w-12 h-12 rounded-xl bg-[#84CC16] flex items-center justify-center text-white font-extrabold text-xl shadow-2xs">
                T
              </div>
              <div class="text-base font-extrabold tracking-tight text-slate-950 uppercase">TESLA TECH</div>
            </div>

            <div class="text-right space-y-1">
              <div class="text-xl sm:text-2xl font-black tracking-tight text-slate-950 uppercase">PRESUPUESTO</div>
              <div class="text-xs font-bold text-slate-800">${q.code}</div>
              <div class="text-xs text-slate-400">Fecha: ${q.date}</div>
              <div class="pt-1 flex justify-end">
                <span class="px-2.5 py-0.5 rounded text-[10px] font-extrabold tracking-wider uppercase ${statusBadgeClass}">${q.status}</span>
              </div>
            </div>
          </div>

          <!-- Caja PARA: -->
          <div class="rounded-xl bg-slate-50/80 border border-slate-200/80 p-4 space-y-1.5">
            <div class="text-[10px] font-bold uppercase tracking-wider text-slate-400">PARA:</div>
            <div class="text-sm font-extrabold text-slate-900 uppercase">${q.fullName}</div>
            <div class="flex items-center gap-2 text-xs text-slate-600 font-medium">
              <span>📞</span>
              <span>${maskPhoneForDoc(q.phone)}</span>
            </div>
            ${q.docNumber ? `
              <div class="flex items-center gap-2 text-xs text-slate-600 font-medium">
                <span class="px-1.5 py-0.5 rounded bg-indigo-100 text-indigo-700 font-bold text-[10px]">ID</span>
                <span>${q.docNumber}</span>
              </div>
            ` : ''}
          </div>

          <!-- Tabla de conceptos -->
          <div class="overflow-x-auto">
            <table class="w-full border-collapse">
              <thead>
                <tr class="border-b border-slate-200 text-[10px] font-bold uppercase tracking-wider text-slate-400">
                  <th class="py-2 text-left">DESCRIPCIÓN</th>
                  <th class="py-2 text-center">CANT.</th>
                  <th class="py-2 text-right">PRECIO</th>
                  <th class="py-2 text-right">SUBTOTAL</th>
                </tr>
              </thead>
              <tbody>
                ${rowsHtml}
              </tbody>
            </table>
          </div>

          <!-- Totales -->
          <div class="flex justify-end pt-1">
            <div class="w-full sm:w-72 space-y-2 text-xs">
              <div class="flex items-center justify-between text-slate-600 font-medium">
                <span>Subtotal</span>
                <span>${formatCOP(subtotal)}</span>
              </div>
              ${Number(q.discount || 0) > 0 ? `
                <div class="flex items-center justify-between text-rose-600 font-medium">
                  <span>Descuento</span>
                  <span>-${formatCOP(q.discount)}</span>
                </div>
              ` : ''}
              <div class="flex items-center justify-between pt-2 border-t border-slate-200">
                <span class="text-sm font-black text-slate-950 uppercase">TOTAL</span>
                <span class="text-lg font-black text-[#65A30D]">${formatCOP(total)}</span>
              </div>
            </div>
          </div>

          ${q.notes ? `<div class="text-xs text-slate-500 border-t border-slate-100 pt-3">${q.notes}</div>` : ''}

          <div class="text-center text-xs text-slate-400 pt-2">
            Presupuesto sin valor fiscal.
          </div>
        </div>

        <!-- Botones de Aprobar / Rechazar -->
        <div class="space-y-2.5 no-print">
          <button type="button" onclick="updateQuoteStatus('${q.id}', 'APROBADO')" class="w-full py-3.5 rounded-xl bg-[#059669] hover:bg-[#047857] text-white font-bold text-sm flex items-center justify-center gap-2 shadow-sm transition-colors">
            <i data-lucide="check" class="w-4 h-4"></i> Aprobar Presupuesto
          </button>
          <button type="button" onclick="updateQuoteStatus('${q.id}', 'RECHAZADO')" class="w-full py-3 rounded-xl bg-rose-50 hover:bg-rose-100 border border-rose-200 text-rose-500 font-bold text-sm flex items-center justify-center gap-2 transition-colors">
            <i data-lucide="x" class="w-4 h-4"></i> Rechazar
          </button>
        </div>

        <div class="text-center text-[11px] text-slate-400 pb-4 no-print">
          Generado con MiTallerControl
        </div>
      `;

      modal.classList.remove('hidden');
      modal.classList.add('flex');
      lucide.createIcons();
    }

    function updateQuoteStatus(quoteId, newStatus) {
      const q = state.quotes.find(item => item.id === quoteId);
      if (!q) return;
      q.status = newStatus;
      saveState();
      openQuoteDocument(quoteId);
      if (state.activeRoute === 'presupuestos') renderWorkspace();
      showToast(`Presupuesto marcado como ${newStatus}`);
    }

    function closeQuoteDocument() {
      state.selectedQuoteId = null;
      const modal = document.getElementById('quote-doc-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    // =========================================================
    // VISTA INICIO
    // =========================================================
    function renderInicioScreen() {
      const q = (state.homeSearch || '').trim().toLowerCase();

      const activeOrders = state.orders.filter(o => o.statusIndex < 4);
      const receivedOrders = state.orders.filter(o => o.statusIndex === 0);
      const todayOrders = state.orders.filter(o => o.isToday);

      const pendingTotal = activeOrders.reduce((acc, o) => {
        const extra = (o.extraQuotes || []).reduce((s, item) => s + item.amount, 0);
        const total = (o.priceTotal || 0) + extra;
        return acc + Math.max(0, total - (o.paidAmount || 0));
      }, 0);

      const pendingOrdersCount = activeOrders.filter(o => {
        const extra = (o.extraQuotes || []).reduce((s, item) => s + item.amount, 0);
        const total = (o.priceTotal || 0) + extra;
        return (total - (o.paidAmount || 0)) > 0;
      }).length;

      let baseList = activeOrders;
      if (state.homeFilterTab === 'recibido') baseList = receivedOrders;
      if (state.homeFilterTab === 'hoy') baseList = todayOrders;

      const filteredOrders = baseList.filter(o =>
        String(o.number).includes(q) ||
        (o.device || '').toLowerCase().includes(q) ||
        (o.client?.name || '').toLowerCase().includes(q) ||
        (o.client?.phone || '').toLowerCase().includes(q)
      );

      const lastOrderText = state.orders[0]?.lastOrderText || 'hace 23h';

      const rowsHtml = filteredOrders.length === 0
        ? `<div class="py-10 text-center text-xs text-dim">No hay órdenes en esta vista.</div>`
        : filteredOrders.map(o => {
            const globalIdx = state.orders.indexOf(o);
            const extra = (o.extraQuotes || []).reduce((s, item) => s + item.amount, 0);
            const total = (o.priceTotal || 0) + extra;
            const pend = Math.max(0, total - (o.paidAmount || 0));
            const statusName = STEPS[o.statusIndex] || 'Recibido';

            return `
              <div onclick="openOrderDetail(${globalIdx})" class="px-5 py-3.5 hover:bg-black/[0.02] dark:hover:bg-white/[0.03] transition-colors cursor-pointer grid grid-cols-12 items-center gap-3 text-xs border-t app-border first:border-t-0">
                <div class="col-span-5 flex items-center gap-3 min-w-0">
                  <div class="w-8 h-8 rounded-full app-muted text-dim flex items-center justify-center shrink-0">
                    <i data-lucide="user" class="w-4 h-4"></i>
                  </div>
                  <div class="truncate">
                    <div class="font-bold text-main truncate">${o.client.name}</div>
                    <div class="text-[11px] text-dim truncate">${o.device}</div>
                  </div>
                </div>
                <div class="col-span-2">
                  <span class="inline-block px-2.5 py-0.5 rounded-md bg-sky-500/15 text-sky-500 dark:text-sky-400 font-semibold text-[11px]">${statusName}</span>
                </div>
                <div class="col-span-1 font-bold text-sec">#${o.number}</div>
                <div class="col-span-1 text-dim text-[11px] truncate">${o.technician || 'Sin asig.'}</div>
                <div class="col-span-1 font-bold text-sec text-[11px]">${o.daysElapsed || '0d'}</div>
                <div class="col-span-2 flex items-center justify-end gap-3 text-right">
                  <div>
                    <div class="font-extrabold text-main text-xs">${formatCOP(pend > 0 ? pend : total)}</div>
                    <div class="text-[10px] ${pend > 0 ? 'text-rose-500 font-medium' : 'text-emerald-500 font-medium'}">${pend > 0 ? 'Pendiente' : 'Pagado'}</div>
                  </div>
                  <button type="button" onclick="event.stopPropagation(); openOrderDetail(${globalIdx})" class="text-dim hover:text-main p-1 rounded-lg">
                    <i data-lucide="settings" class="w-3.5 h-3.5"></i>
                  </button>
                </div>
              </div>
            `;
          }).join('');

      return `
        <div class="space-y-5">
          <div class="flex flex-wrap items-center justify-between gap-4">
            <div>
              <h1 class="text-[20px] font-bold text-main leading-tight">Inicio</h1>
              <p class="text-[11px] text-dim mt-0.5">Última orden: ${lastOrderText}</p>
            </div>

            <div class="flex items-center gap-2.5 flex-wrap">
              <div class="relative">
                <i data-lucide="search" class="w-3.5 h-3.5 text-dim absolute left-3 top-1/2 -translate-y-1/2"></i>
                <input
                  type="text"
                  value="${state.homeSearch}"
                  oninput="updateHomeSearch(this.value)"
                  placeholder="Buscar órdenes o clientes..."
                  class="pl-8 pr-8 py-1.5 w-64 app-surface border rounded-lg text-xs text-main focus:outline-none focus:border-[#84CC16]"
                />
                <button type="button" onclick="showToast('Escáner de códigos / IMEI listo')" class="text-dim hover:text-main absolute right-2.5 top-1/2 -translate-y-1/2" title="Escanear código">
                  <i data-lucide="scan-line" class="w-3.5 h-3.5"></i>
                </button>
              </div>

              <button type="button" onclick="refreshInicio()" class="inline-flex items-center gap-1.5 px-3 py-1.5 app-surface border rounded-lg text-xs font-semibold text-sec hover:opacity-90 transition-colors">
                <i id="inicio-refresh-icon" data-lucide="rotate-cw" class="w-3.5 h-3.5 text-dim"></i>
                Actualizar
              </button>

              <button type="button" onclick="toggleThemeHint()" class="w-8 h-8 rounded-lg app-surface border hover:opacity-90 flex items-center justify-center text-sec transition-colors" title="Alternar tema">
                <i data-lucide="${state.darkMode ? 'sun' : 'moon'}" class="w-3.5 h-3.5 ${state.darkMode ? 'text-amber-300' : ''}"></i>
              </button>

              <button type="button" onclick="navigate('recibir')" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#84CC16] hover:bg-[#73B312] text-slate-950 font-bold text-xs shadow-2xs transition-colors">
                <i data-lucide="plus" class="w-3.5 h-3.5"></i> Recibir
              </button>
            </div>
          </div>

          <div class="grid grid-cols-1 md:grid-cols-12 gap-4">
            <div class="md:col-span-5 rounded-2xl bg-[#84CC16] text-slate-950 p-5 flex flex-col justify-between min-h-[126px] shadow-2xs">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-[#1E3A08]">Pendiente</span>
                <button type="button" onclick="toggleHideAmounts()" class="text-[#2F5211] hover:text-slate-950 p-1 rounded-lg transition-colors" title="Ocultar/mostrar montos">
                  <i data-lucide="${state.hideAmounts ? 'eye-off' : 'eye'}" class="w-4 h-4"></i>
                </button>
              </div>
              <div class="mt-3">
                <div class="text-[22px] font-extrabold tracking-tight text-slate-950">${formatCOP(pendingTotal)}</div>
                <div class="text-xs font-medium text-[#2F5211] mt-1">Por cobrar en ${pendingOrdersCount} ${pendingOrdersCount === 1 ? 'orden' : 'órdenes'}</div>
              </div>
            </div>

            <div class="md:col-span-3 rounded-2xl app-surface border p-5 flex flex-col justify-between min-h-[126px] shadow-2xs">
              <div class="flex items-center gap-2 text-xs font-semibold text-sec">
                <i data-lucide="plus-circle" class="w-4 h-4 text-[#84CC16]"></i>
                <span>Nuevas Hoy</span>
              </div>
              <div class="mt-3">
                <div class="text-[22px] font-extrabold text-main leading-none">${todayOrders.length}</div>
                <div class="text-xs text-dim mt-2">${todayOrders.length === 0 ? 'Ninguna todavía' : 'Recibidas hoy'}</div>
              </div>
            </div>

            <div class="md:col-span-4 rounded-2xl app-surface border p-5 flex flex-col justify-between min-h-[126px] shadow-2xs">
              <div class="flex items-center gap-2 text-xs font-semibold text-sec">
                <i data-lucide="clock" class="w-4 h-4 text-[#84CC16]"></i>
                <span>Órdenes Activas</span>
              </div>
              <div class="mt-3 flex items-end justify-between gap-2">
                <div>
                  <div class="text-[22px] font-extrabold text-main leading-none">${activeOrders.length}</div>
                  <div class="text-xs text-dim mt-2">Ninguna lista para entregar</div>
                </div>
                <button type="button" onclick="setHomeTab('hoy')" class="px-2.5 py-1 rounded-lg app-muted hover:opacity-90 text-[11px] font-semibold text-sec transition-colors">
                  Para hoy
                </button>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2">
            <button type="button" onclick="setHomeTab('activas')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-colors ${
              state.homeFilterTab === 'activas'
                ? 'bg-[#84CC16] text-slate-950'
                : 'app-surface border text-dim hover:text-main'
            }">
              Activas ${activeOrders.length}
            </button>
            <button type="button" onclick="setHomeTab('recibido')" class="px-3.5 py-1.5 rounded-lg text-xs font-bold transition-colors ${
              state.homeFilterTab === 'recibido'
                ? 'bg-[#84CC16] text-slate-950'
                : 'app-surface border text-dim hover:text-main'
            }">
              Recibido ${receivedOrders.length}
            </button>
          </div>

          <div class="app-surface rounded-2xl border overflow-hidden shadow-2xs">
            <div class="px-5 py-3 border-b app-border grid grid-cols-12 gap-3 text-[11px] font-semibold text-dim">
              <div class="col-span-5">Cliente</div>
              <div class="col-span-2">Estado</div>
              <div class="col-span-1">Orden</div>
              <div class="col-span-1">Técnico</div>
              <div class="col-span-1">Tiempo</div>
              <div class="col-span-2 text-right">Balance</div>
            </div>
            <div>
              ${rowsHtml}
            </div>
          </div>
        </div>
      `;
    }

    function updateHomeSearch(val) {
      state.homeSearch = val;
      saveState();
      renderWorkspace();
      const input = document.querySelector('input[placeholder*="Buscar órdenes"]');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function setHomeTab(tab) {
      state.homeFilterTab = tab;
      saveState();
      renderWorkspace();
    }

    function toggleHideAmounts() {
      state.hideAmounts = !state.hideAmounts;
      saveState();
      renderWorkspace();
    }

    function toggleThemeHint() {
      state.darkMode = !state.darkMode;
      applyTheme();
      saveState();
      renderSidebar();
      renderWorkspace();
      if (state.selectedOrderIndex !== null && state.orders[state.selectedOrderIndex]) {
        openOrderDetail(state.selectedOrderIndex);
      }
      showToast(state.darkMode ? 'Modo oscuro activado' : 'Modo claro activado');
    }

    function refreshInicio() {
      const icon = document.getElementById('inicio-refresh-icon');
      if (icon) icon.classList.add('animate-spin');
      setTimeout(() => {
        if (icon) icon.classList.remove('animate-spin');
        renderWorkspace();
        showToast('Tablero actualizado');
      }, 350);
    }

    // =========================================================
    // VISTA CLIENTES + MODAL NUEVO CLIENTE + DETALLE CLIENTE
    // =========================================================
    function renderClientesListView() {
      const q = (state.clientSearch || '').trim().toLowerCase();
      const filtered = state.clients.filter(c =>
        c.fullName.toLowerCase().includes(q) ||
        (c.docNumber || '').toLowerCase().includes(q) ||
        (c.phone || '').toLowerCase().includes(q)
      );

      const frequentCount = state.clients.filter(c => getClientOrders(c).length >= 2).length;
      const posCount = state.clients.filter(c => c.isPosClient).length;

      const rowsHtml = filtered.length === 0
        ? `<div class="app-surface rounded-2xl border p-10 text-center text-xs text-dim">No se encontraron clientes con "${state.clientSearch}".</div>`
        : filtered.map(c => `
            <div onclick="openClientDetail('${c.id}')" class="app-surface hover:border-[#84CC16] border rounded-xl px-5 py-3.5 flex items-center justify-between gap-4 cursor-pointer transition-colors shadow-2xs">
              <div class="flex items-center gap-3.5 w-1/3 min-w-[180px]">
                <div class="w-9 h-9 rounded-full ${c.avatarBg || 'bg-emerald-500/20 text-emerald-400'} font-bold text-xs flex items-center justify-center shrink-0">
                  ${c.initials || getInitials(c.fullName)}
                </div>
                <div>
                  <div class="text-[13px] font-bold text-main leading-tight">${c.fullName}</div>
                  ${c.conflictive ? `<span class="inline-block mt-0.5 text-[10px] font-semibold text-rose-500 bg-rose-500/15 px-1.5 py-0.5 rounded">Cliente conflictivo</span>` : ''}
                </div>
              </div>
              <div class="w-1/4 text-xs text-dim font-medium">
                ${c.docNumber ? `<span class="opacity-70 mr-1">#</span>${c.docNumber}` : ''}
              </div>
              <div class="flex-1 flex items-center justify-end gap-6 text-xs text-sec font-medium">
                <span class="inline-flex items-center gap-1.5">
                  <i data-lucide="phone" class="w-3.5 h-3.5 text-dim"></i>
                  ${c.phone || '—'}
                </span>
                <i data-lucide="chevron-right" class="w-4 h-4 text-dim shrink-0"></i>
              </div>
            </div>
          `).join('');

      return `
        <div class="flex items-center justify-between mb-4">
          <h1 class="text-[20px] font-bold text-main">Clientes</h1>
          <button onclick="refreshInicio()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 app-surface border rounded-lg text-xs font-semibold text-sec hover:opacity-90">
            <i data-lucide="rotate-cw" class="w-3.5 h-3.5 text-dim"></i> Actualizar
          </button>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-3 mb-5">
          <div class="flex flex-wrap items-center gap-2.5">
            <div class="flex items-center gap-2 mr-1">
              <i data-lucide="users" class="w-4 h-4 text-main"></i>
              <h2 class="text-[16px] font-bold text-main">Mis Clientes</h2>
              <button onclick="showToast('Haz clic en cualquier cliente para ver su historial y saldo pendiente')" class="w-6 h-6 rounded-full accent-soft text-[#84CC16] flex items-center justify-center hover:scale-105 transition-transform">
                <i data-lucide="play" class="w-3 h-3 fill-current"></i>
              </button>
            </div>

            <div class="relative">
              <i data-lucide="search" class="w-3.5 h-3.5 text-dim absolute left-3 top-1/2 -translate-y-1/2"></i>
              <input
                type="text"
                value="${state.clientSearch}"
                oninput="updateClientSearch(this.value)"
                placeholder="Buscar por nombre, cédula, teléfon"
                class="pl-8 pr-3 py-1.5 w-60 app-surface border rounded-lg text-xs text-main focus:outline-none focus:border-[#84CC16]"
              />
            </div>

            <div class="app-surface border rounded-lg px-3 py-1 flex items-center gap-2 shadow-2xs">
              <span class="w-6 h-6 rounded-md accent-soft text-[#84CC16] flex items-center justify-center">
                <i data-lucide="users" class="w-3.5 h-3.5"></i>
              </span>
              <div class="leading-none">
                <div class="text-xs font-extrabold text-main">${state.clients.length}</div>
                <div class="text-[9px] font-bold uppercase text-dim mt-0.5">TOTAL</div>
              </div>
            </div>

            <div class="app-surface border rounded-lg px-3 py-1 flex items-center gap-2 shadow-2xs">
              <span class="w-6 h-6 rounded-md bg-emerald-500/15 text-emerald-400 flex items-center justify-center">
                <i data-lucide="user-check" class="w-3.5 h-3.5"></i>
              </span>
              <div class="leading-none">
                <div class="text-xs font-extrabold text-main">${frequentCount}</div>
                <div class="text-[9px] font-bold uppercase text-dim mt-0.5">FRECUENTES</div>
              </div>
            </div>

            <div class="app-surface border rounded-lg px-3 py-1 flex items-center gap-2 shadow-2xs">
              <span class="w-6 h-6 rounded-md bg-purple-500/15 text-purple-400 flex items-center justify-center">
                <i data-lucide="shopping-bag" class="w-3.5 h-3.5"></i>
              </span>
              <div class="leading-none">
                <div class="text-xs font-extrabold text-main">${posCount}</div>
                <div class="text-[9px] font-bold uppercase text-dim mt-0.5">CLIENTES POS</div>
              </div>
            </div>
          </div>

          <div class="flex items-center gap-2 flex-wrap">
            <button onclick="showToast('Selecciona un archivo .CSV para importar clientes')" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg accent-soft border text-[#84CC16] font-semibold text-xs transition-colors">
              <i data-lucide="file-spreadsheet" class="w-3.5 h-3.5"></i> Importar CSV
            </button>
            <button onclick="exportClientsCSV()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg accent-soft border text-[#84CC16] font-semibold text-xs transition-colors">
              <i data-lucide="download" class="w-3.5 h-3.5"></i> Exportar
            </button>
            <button onclick="cleanDuplicateClients()" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-amber-500/15 text-amber-400 font-semibold text-xs transition-colors">
              <i data-lucide="git-merge" class="w-3.5 h-3.5"></i> Limpiar Duplicados
            </button>
            <button onclick="openNewClientModal()" class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-lg bg-[#84CC16] hover:bg-[#73B312] text-slate-950 font-bold text-xs shadow-2xs transition-colors">
              <i data-lucide="plus" class="w-3.5 h-3.5"></i> Nuevo Cliente
            </button>
          </div>
        </div>

        <div class="px-5 pb-2 flex items-center text-[10px] font-bold uppercase tracking-wider text-dim">
          <div class="w-1/3 min-w-[180px]">CLIENTE</div>
          <div class="w-1/4">IDENTIFICACIÓN</div>
          <div class="flex-1">TELÉFONO</div>
        </div>

        <div class="space-y-2.5">
          ${rowsHtml}
        </div>
      `;
    }

    function updateClientSearch(val) {
      state.clientSearch = val;
      saveState();
      renderWorkspace();
      const input = document.querySelector('input[placeholder*="Buscar por nombre"]');
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }

    function exportClientsCSV() {
      const csv = ['Nombre,Documento,Telefono,Correo,Direccion']
        .concat(state.clients.map(c => `"${c.fullName}","${c.docNumber || ''}","${c.phone || ''}","${c.email || ''}","${c.address || ''}"`))
        .join('\n');
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'clientes_tesla_tech.csv';
      a.click();
      URL.revokeObjectURL(url);
      showToast('Listado de clientes exportado en CSV');
    }

    function cleanDuplicateClients() {
      const seen = new Set();
      const unique = [];
      let removed = 0;
      for (const c of state.clients) {
        const key = `${c.fullName.trim().toLowerCase()}|${(c.phone || '').trim()}`;
        if (seen.has(key)) removed++;
        else {
          seen.add(key);
          unique.push(c);
        }
      }
      state.clients = unique;
      saveState();
      renderWorkspace();
      showToast(removed > 0 ? `Se eliminaron ${removed} duplicados` : 'No se encontraron clientes duplicados');
    }

    function openNewClientModal(editingClientId = null) {
      const existing = editingClientId ? state.clients.find(c => c.id === editingClientId) : null;
      state.newClientType = existing ? (existing.type || 'Persona') : 'Persona';
      state.newClientDocType = existing ? (existing.docType || 'CC') : 'CC';
      const isEmpresa = state.newClientType === 'Empresa';

      openQuickModal(`
        <div class="flex items-start justify-between mb-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl accent-soft text-[#84CC16] flex items-center justify-center shrink-0">
              <i data-lucide="user-plus" class="w-5 h-5"></i>
            </div>
            <div>
              <h3 class="font-bold text-base text-main leading-tight">${existing ? 'Editar Cliente' : 'Nuevo Cliente'}</h3>
              <p class="text-xs text-dim mt-0.5">Queda guardado para la próxima orden o venta</p>
            </div>
          </div>
          <button onclick="closeQuickModal()" class="p-1 text-dim hover:text-main rounded-lg">
            <i data-lucide="x" class="w-4 h-4"></i>
          </button>
        </div>

        <div class="grid grid-cols-2 gap-1.5 app-muted p-1 rounded-xl mb-4 text-xs font-bold">
          <button type="button" onclick="setClientModalType('Persona')" class="py-2 rounded-lg transition-all ${!isEmpresa ? 'app-surface text-main shadow-2xs' : 'text-dim'}">Persona</button>
          <button type="button" onclick="setClientModalType('Empresa')" class="py-2 rounded-lg transition-all ${isEmpresa ? 'app-surface text-main shadow-2xs' : 'text-dim'}">Empresa</button>
        </div>

        <form onsubmit="submitClientForm(event, '${existing ? existing.id : ''}')" class="space-y-3.5 text-xs">
          ${!isEmpresa
            ? `<div class="grid grid-cols-2 gap-3">
                 <div>
                   <label class="block font-bold text-sec mb-1">Nombre *</label>
                   <input id="nc-first" type="text" value="${existing ? (existing.firstName || '') : ''}" placeholder="Ej. María" class="w-full px-3 py-2.5 border rounded-xl focus:outline-none focus:border-[#84CC16]" required />
                 </div>
                 <div>
                   <label class="block font-bold text-sec mb-1">Apellido *</label>
                   <input id="nc-last" type="text" value="${existing ? (existing.lastName || '') : ''}" placeholder="Ej. Pérez" class="w-full px-3 py-2.5 border rounded-xl focus:outline-none focus:border-[#84CC16]" required />
                 </div>
               </div>`
            : `<div>
                 <label class="block font-bold text-sec mb-1">Razón Social / Empresa *</label>

    function setClientModalType(type) {
      state.newClientType = type;
      openNewClientModal(state.selectedClientId);
    }

    function setClientModalDocType(dt) {
      state.newClientDocType = dt;
      openNewClientModal(state.selectedClientId);
    }

    function submitClientForm(e, editId) {
      e.preventDefault();
      const rawPhone = (document.getElementById('nc-phone')?.value || '').trim();
      const phone = rawPhone ? (rawPhone.startsWith('+') ? rawPhone : '+57' + rawPhone) : '';
      let firstName = '', lastName = '', fullName = '';

      if (state.newClientType === 'Empresa') {
        fullName = (document.getElementById('nc-company')?.value || '').trim();
        firstName = fullName;
      } else {
        firstName = (document.getElementById('nc-first')?.value || '').trim();
        lastName = (document.getElementById('nc-last')?.value || '').trim();
        fullName = `${firstName} ${lastName}`.trim();
      }
      if (!fullName) return;

      const docNumber = (document.getElementById('nc-doc-num')?.value || '').trim();
      const email = (document.getElementById('nc-email')?.value || '').trim();
      const address = (document.getElementById('nc-address')?.value || '').trim();

      if (editId) {
        const cli = state.clients.find(c => c.id === editId);
        if (cli) {
          Object.assign(cli, {
            type: state.newClientType, firstName, lastName, fullName,
            initials: getInitials(fullName), phone, docType: state.newClientDocType,
            docNumber, email, address
          });
        }
        showToast('Cliente actualizado');
      } else {
        state.clients.unshift({
          id: 'cli-' + Date.now(), type: state.newClientType, firstName, lastName, fullName,
          initials: getInitials(fullName), avatarBg: 'bg-emerald-500/20 text-emerald-400',
          phone, docType: state.newClientDocType, docNumber, email, address,
          conflictive: false, isPosClient: false
        });
        showToast(`Cliente "${fullName}" guardado`);
      }

      saveState();
      closeQuickModal();
      renderWorkspace();
    }

    function openClientDetail(clientId) {
      state.selectedClientId = clientId;
      saveState();
      renderWorkspace();
    }

    function backToClientsList() {
      state.selectedClientId = null;
      saveState();
      renderWorkspace();
    }

    function toggleClientConflictive(clientId) {
      const cli = state.clients.find(c => c.id === clientId);
      if (!cli) return;
      cli.conflictive = !cli.conflictive;
      saveState();
      renderWorkspace();
      showToast(cli.conflictive ? 'Marcado como Cliente conflictivo' : 'Marca removida');
    }

    function deleteClientById(clientId) {
      const cli = state.clients.find(c => c.id === clientId);
      if (!cli) return;
      state.clients = state.clients.filter(c => c.id !== clientId);
      state.selectedClientId = null;
      saveState();
      renderWorkspace();
      showToast(`Cliente "${cli.fullName}" eliminado`);
    }

    function renderClientDetailView() {
      const cli = state.clients.find(c => c.id === state.selectedClientId);
      if (!cli) {
        state.selectedClientId = null;
        return renderClientesListView();
      }

      const clientOrders = getClientOrders(cli);
      const pendingSum = clientOrders.reduce((acc, o) => {
        const extra = (o.extraQuotes || []).reduce((s, q) => s + q.amount, 0);
        return acc + Math.max(0, ((o.priceTotal || 0) + extra) - (o.paidAmount || 0));
      }, 0);
      const lastOrderDate = clientOrders.length > 0 ? clientOrders[0].receivedDate.split(' ').slice(0, 2).join(' ') : '—';

      const ordersHtml = clientOrders.length === 0
        ? `<div class="app-surface rounded-2xl border p-8 text-center text-xs text-dim">Este cliente aún no tiene órdenes registradas.</div>`
        : clientOrders.map(o => {
            const globalIdx = state.orders.indexOf(o);
            const extra = (o.extraQuotes || []).reduce((s, q) => s + q.amount, 0);
            const total = (o.priceTotal || 0) + extra;
            const pend = Math.max(0, total - (o.paidAmount || 0));
            return `
              <div onclick="openOrderDetail(${globalIdx})" class="app-surface hover:border-[#84CC16] border rounded-2xl p-4 flex items-center justify-between gap-4 cursor-pointer transition-all shadow-2xs">

                <div class="flex items-center gap-3 text-right">

                <div class="font-extrabold text-sm text-main">${clientOrders.length}</div>

              <div class="app-surface rounded-2xl border p-3.5 shadow-2xs">

    function recalcReceiveFinance() {
      const total = Number(document.getElementById('rec-total-input')?.value || 0);
      const abono = Number(document.getElementById('rec-abono-input')?.value || 0);
      const desc = Number(document.getElementById('rec-desc-input')?.value || 0);
      const afterDesc = Math.max(0, total - (total * desc / 100));
      const saldo = Math.max(0, afterDesc - abono);
      const el = document.getElementById('rec-saldo-pendiente');
      if (el) el.textContent = formatCOP(saldo);
    }

    function updateMissingBadges() {
      const checks = {
        'Nombre': !!(document.getElementById('rec-nombre')?.value || '').trim(),
        'Apellido': !!(document.getElementById('rec-apellido')?.value || '').trim(),
        'Teléfono': !!(document.getElementById('rec-telefono')?.value || '').trim(),
        'Marca': !!(document.getElementById('rec-marca')?.value || '').trim(),
        'Modelo': !!(document.getElementById('rec-modelo')?.value || '').trim(),
        'Falla': !!(document.getElementById('rec-falla')?.value || '').trim()
      };

      document.querySelectorAll('[data-missing]').forEach(pill => {
        const key = pill.getAttribute('data-missing');
        const ok = checks[key];
        const dot = pill.querySelector('span');
        if (ok) {
          pill.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-full border border-[#84CC16] accent-soft text-[11px] font-semibold text-[#84CC16]';
          if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-[#84CC16]';
        } else {
          pill.className = 'inline-flex items-center gap-1 px-2.5 py-1 rounded-full border app-surface text-[11px] font-medium text-sec';
          if (dot) dot.className = 'w-1.5 h-1.5 rounded-full bg-slate-500';
        }
      });
    }

    function addSecondaryPhoneField() {
      const container = document.getElementById('extra-phones-container');
      if (!container) return;
      const div = document.createElement('div');
      div.className = 'flex items-center gap-2';
      div.innerHTML = `<span class="px-2.5 py-2 rounded-xl app-subtle border text-xs font-bold text-sky-400">+57</span><input type="text" placeholder="Teléfono secundario" class="flex-1 px-3 py-2 text-xs border rounded-xl" />`;
      container.appendChild(div);
    }

    function quickSearchClient() {
      if (!state.clients.length) return;
      const first = state.clients[0];
      if (document.getElementById('rec-nombre')) document.getElementById('rec-nombre').value = first.firstName || first.fullName;
      if (document.getElementById('rec-apellido')) document.getElementById('rec-apellido').value = first.lastName || '';
      if (document.getElementById('rec-telefono')) document.getElementById('rec-telefono').value = (first.phone || '').replace(/^\+57/, '');
      updateMissingBadges();
      showToast(`Cliente cargado: ${first.fullName}`);
    }

    function toggleAccessoryCheck(acc) {
      const idx = receiveFormState.accessoriesChecked.indexOf(acc);
      if (idx >= 0) receiveFormState.accessoriesChecked.splice(idx, 1);
      else receiveFormState.accessoriesChecked.push(acc);
    }

    function addCustomAccessory() {
      const inp = document.getElementById('rec-acc-input');
      const val = (inp?.value || '').trim();
      if (!val) return;
      receiveFormState.customAccessories.push(val);
      inp.value = '';
